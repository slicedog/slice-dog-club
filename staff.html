<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff | Sello Slice Dog</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #4a2311; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: screen; margin: 0; }
        .italic-black { font-weight: 900; font-style: italic; text-transform: uppercase; }
        #qrcode img { display: inline-block; border-radius: 2rem; border: 15px solid white; box-shadow: 0 25px 50px rgba(0,0,0,0.5); }
    </style>
</head>
<body class="p-6 text-center">

    <div class="mb-8">
        <h1 class="italic-black text-4xl mb-2">VALIDACIÓN <span class="text-orange-500">ACTIVA</span></h1>
        <p class="text-[10px] tracking-widest opacity-40 font-bold">ESCANEÉ PARA OBTENER SU SELLO</p>
    </div>

    <div id="qrcode" class="bg-white p-4 rounded-[3rem] mb-10 transition-opacity duration-500"></div>

    <div class="opacity-20 flex items-center gap-2">
        <i data-lucide="refresh-cw" class="w-3 h-3 animate-spin"></i>
        <p class="text-[10px] font-bold uppercase tracking-tighter">Sincronizado con el servidor</p>
    </div>

    <script>
        const SECRET_SALT = "SLICE_DOG_PRO_2026"; // CLAVE MAESTRA

        function updateQR() {
            const now = new Date();
            const interval = Math.floor(now.getMinutes() / 3);
            const token = btoa(SECRET_SALT + now.getFullYear() + (now.getMonth()+1) + now.getDate() + now.getHours() + interval).substring(0, 12);
            
            const qrContainer = document.getElementById('qrcode');
            if (qrContainer.dataset.token !== token) {
                qrContainer.dataset.token = token;
                qrContainer.innerHTML = "";
                const qr = qrcode(0, 'H');
                qr.addData(token); // AQUÍ SOLO VA EL TOKEN, NO UN LINK
                qr.make();
                qrContainer.innerHTML = qr.createImgTag(10, 0);
            }
        }

        setInterval(updateQR, 5000); // Revisa cada 5 seg si debe cambiar
        updateQR();
        lucide.createIcons();
    </script>
</body>
</html>
