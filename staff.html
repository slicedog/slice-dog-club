<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff | Generador de Sello Dinámico</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #4a2311; color: white; }
        .italic-black { font-weight: 900; font-style: italic; text-transform: uppercase; }
        #qrcode img { display: inline-block; border-radius: 1.5rem; border: 8px solid white; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5); }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-6 text-center">

    <div class="mb-8">
        <div class="bg-amber-400 text-neutral-900 p-4 rounded-2xl inline-block mb-4 shadow-lg">
            <i data-lucide="shield-check" class="w-10 h-10"></i>
        </div>
        <h1 class="italic-black text-3xl">Validación <span class="text-orange-500">Activa</span></h1>
        <p class="text-xs tracking-widest opacity-50">SISTEMA DINÁMICO CADA 3 MINUTOS</p>
    </div>

    <div id="qrcode" class="bg-white p-4 rounded-[2.5rem] mb-8"></div>

    <div class="bg-white/10 backdrop-blur-md p-6 rounded-3xl border border-white/20 w-full max-w-xs">
        <p id="timer-text" class="text-orange-400 font-black text-2xl italic mb-1">Cargando...</p>
        <p class="text-[10px] uppercase font-bold opacity-60">Para nuevo código QR</p>
    </div>

    <script>
        const SECRET_SALT = "SliceDog_Super_Secret_2026"; 

        function getIntervalToken() {
            const now = new Date();
            const minutes = now.getMinutes();
            // Esta es la magia: dividimos los 60 min entre 3. 
            // Solo cambia cuando el resultado de la división entera cambia.
            const interval = Math.floor(minutes / 3); 
            const timeString = `${now.getFullYear()}-${now.getMonth()+1}-${now.getDate()}-${now.getHours()}-${interval}`;
            return btoa(SECRET_SALT + timeString).substring(0, 12); 
        }

        function updateUI() {
            const token = getIntervalToken();
            const qrContainer = document.getElementById('qrcode');
            qrContainer.innerHTML = "";
            const qr = qrcode(0, 'H');
            qr.addData(token);
            qr.make();
            qrContainer.innerHTML = qr.createImgTag(10, 0);

            // Calcular cuánto falta para el siguiente bloque de 3 minutos
            const now = new Date();
            const secondsInCurrentInterval = (now.getMinutes() % 3) * 60 + now.getSeconds();
            const remaining = 180 - secondsInCurrentInterval;
            
            const mins = Math.floor(remaining / 60);
            const secs = remaining % 60;
            document.getElementById('timer-text').innerText = `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        setInterval(updateUI, 1000);
        updateUI();
        lucide.createIcons();
    </script>
</body>
</html>
