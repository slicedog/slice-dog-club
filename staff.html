<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff | Slice Dog v4.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #4a2311; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .italic-black { font-weight: 900; font-style: italic; text-transform: uppercase; }
        #qrcode img { display: inline-block; border-radius: 2.5rem; border: 15px solid white; box-shadow: 0 25px 50px rgba(0,0,0,0.6); }
    </style>
</head>
<body class="p-6 text-center">

    <div class="mb-8">
        <h1 class="italic-black text-4xl mb-2">QR <span class="text-orange-500">DINÁMICO</span></h1>
        <p class="text-[10px] tracking-[0.3em] font-bold opacity-50 uppercase">Seguridad Máxima v4.0</p>
    </div>

    <div id="qrcode" class="bg-white p-5 rounded-[3.5rem] mb-10"></div>

    <div class="bg-white/10 p-6 rounded-[2.5rem] w-full max-w-xs backdrop-blur-md border border-white/10">
        <p id="timer-display" class="text-orange-400 font-black text-2xl italic">--:--</p>
        <p class="text-[9px] font-bold opacity-40 uppercase tracking-widest mt-1">Siguiente actualización</p>
    </div>

    <script>
        const SECRET_SALT = "SD2026"; // Salt más corto para evitar errores de base64
        const BLOQUE_TIEMPO_MS = 180000; // 3 Minutos exactos

        function updateQR() {
            const now = Date.now();
            const intervalAbsoluto = Math.floor(now / BLOQUE_TIEMPO_MS);
            
            // CORRECCIÓN: Ponemos el tiempo AL INICIO y usamos una cadena más larga
            // Esto hace que el QR cambie visualmente de forma drástica cada 3 min
            const token = btoa(intervalAbsoluto + "_" + SECRET_SALT);
            
            const qrContainer = document.getElementById('qrcode');
            if (qrContainer.dataset.token !== token) {
                qrContainer.dataset.token = token;
                qrContainer.innerHTML = "";
                const qr = qrcode(0, 'H');
                qr.addData(token);
                qr.make();
                qrContainer.innerHTML = qr.createImgTag(10, 0);
                console.log("Token Generado (Staff):", token);
            }

            const remaining = Math.ceil((BLOQUE_TIEMPO_MS - (now % BLOQUE_TIEMPO_MS)) / 1000);
            const mins = Math.floor(remaining / 60);
            const secs = remaining % 60;
            document.getElementById('timer-display').innerText = `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        setInterval(updateQR, 1000);
        updateQR();
        lucide.createIcons();
    </script>
</body>
</html>
