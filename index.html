<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title id="page-title">Slice Dog Club</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        :root { --sd-mustard: #eb9a1f; --sd-dark: #4a2311; --sd-bg: #f3e5d0; }
        body { font-family: 'Inter', sans-serif; background-color: var(--sd-bg); color: var(--sd-dark); margin: 0; padding: 0; width: 100%; overflow-x: hidden; }
        .italic-black { font-weight: 900; font-style: italic; text-transform: uppercase; }
        #loader { position: fixed; inset: 0; background: var(--sd-bg); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; transition: opacity 0.5s; }
        .stamp-active { background: linear-gradient(135deg, var(--sd-mustard) 0%, #c97e10 100%); color: white; border: none; }
        @keyframes pulse-soft { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
        .animate-pulse-soft { animation: pulse-soft 2s infinite; }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc, updateDoc, onSnapshot, deleteField } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAFwDQVPy4xRjw4rxcKcZEwNx1suV7eWW8",
            authDomain: "slice-dog-test-firebase.firebaseapp.com",
            projectId: "slice-dog-test-firebase",
            storageBucket: "slice-dog-test-firebase.firebasestorage.app",
            messagingSenderId: "1024055139023",
            appId: "1:1024055139023:web:42985e24651b5a5f38f5ba"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const COMERCIO_ID = 'slicedog';
        let userEmail = JSON.parse(localStorage.getItem(`sd_user_${COMERCIO_ID}`));
        let timerRef = null;

        // Forzar carga de iconos inicial
        lucide.createIcons();

        async function cleanExpiredPin(email, timestamp) {
            const expTime = 5 * 60 * 1000; // 5 Minutos
            if (Date.now() - timestamp > expTime) {
                await updateDoc(doc(db, "users", email), {
                    active_pin: deleteField(),
                    pin_timestamp: deleteField(),
                    pin_type: deleteField()
                });
                return true;
            }
            return false;
        }

        function renderApp(data) {
            document.getElementById('loader').style.opacity = '0';
            setTimeout(() => document.getElementById('loader').classList.add('hidden'), 500);
            
            document.getElementById('register-modal').classList.add('hidden');
            document.getElementById('main-ui').classList.remove('hidden');
            document.getElementById('user-greeting').innerText = `HOLA, ${data.name || 'PIZZERO'} 🍕`;
            
            const currentStamps = data.stamps || 0;
            const grid = document.getElementById('stamps-grid'); grid.innerHTML = '';
            
            // Renderizar Sellos (Siempre visibles ahora)
            for(let i=0; i<10; i++) {
                const active = i < currentStamps;
                const slot = document.createElement('div');
                slot.className = `aspect-square rounded-2xl flex items-center justify-center border-2 ${active ? 'stamp-active' : 'border-dashed border-neutral-300 bg-white/50'}`;
                slot.innerHTML = active ? (i === 9 ? '<i data-lucide="gift"></i>' : '<i data-lucide="pizza"></i>') : (i === 9 ? '<i data-lucide="gift" class="text-neutral-300"></i>' : '');
                grid.appendChild(slot);
            }

            const btnContainer = document.getElementById('action-btn-container');
            if (data.active_pin) {
                // Si hay PIN, verificar si ya expiró antes de mostrarlo
                const pinTime = data.pin_timestamp || 0;
                const remaining = Math.ceil(((5 * 60 * 1000) - (Date.now() - pinTime)) / 1000);

                if (remaining <= 0) {
                    cleanExpiredPin(data.email, pinTime);
                } else {
                    btnContainer.innerHTML = `
                        <div class="w-full py-6 bg-orange-600 text-white rounded-[2rem] italic-black flex flex-col items-center shadow-lg animate-pulse-soft">
                            <span class="text-xs opacity-70 mb-1">CÓDIGO DE VALIDACIÓN</span>
                            <span class="text-5xl tracking-widest mb-1">${data.active_pin}</span>
                            <span id="timer-text" class="text-[10px] font-bold uppercase">Expira en ${remaining}s</span>
                        </div>`;
                    
                    if(timerRef) clearInterval(timerRef);
                    timerRef = setInterval(() => {
                        const nowRem = Math.ceil(((5 * 60 * 1000) - (Date.now() - pinTime)) / 1000);
                        if(nowRem <= 0) { clearInterval(timerRef); cleanExpiredPin(data.email, pinTime); }
                        else { document.getElementById('timer-text').innerText = `Expira en ${nowRem}s`; }
                    }, 1000);
                }
            } else {
                if(timerRef) clearInterval(timerRef);
                if (currentStamps >= 10) {
                    btnContainer.innerHTML = `<button onclick="window.generatePin('TABLERO')" class="w-full py-5 bg-orange-600 text-white rounded-[1.8rem] italic-black shadow-lg animate-bounce uppercase">Canjear Premio Gratis</button>`;
                } else {
                    btnContainer.innerHTML = `<button onclick="window.generatePin('SELLO')" class="w-full py-5 bg-[var(--sd-mustard)] text-white rounded-[1.8rem] italic-black flex items-center justify-center gap-3 shadow-lg uppercase"><i data-lucide="hash"></i> Solicitar Sello</button>`;
                }
            }
            lucide.createIcons();
        }

        window.generatePin = async (type) => {
            const pin = Math.floor(1000 + Math.random() * 9000);
            await updateDoc(doc(db, "users", userEmail), {
                active_pin: pin,
                pin_type: type,
                pin_timestamp: Date.now()
            });
        };

        // Escuchar cambios en tiempo real
        if(userEmail) {
            onSnapshot(doc(db, "users", userEmail), (snap) => {
                if(snap.exists()) renderApp({...snap.data(), email: userEmail});
            });
        } else {
            document.getElementById('loader').classList.add('hidden');
            document.getElementById('register-modal').classList.remove('hidden');
        }

        document.getElementById('btn-register').onclick = async () => {
            const n = document.getElementById('reg-name').value, e = document.getElementById('reg-email').value.toLowerCase().trim();
            if(!e || !n) return alert("Completa los campos");
            await setDoc(doc(db, "users", e), { name: n, email: e, stamps: 1, lastUpdate: new Date(), comercio_id: COMERCIO_ID });
            localStorage.setItem(`sd_user_${COMERCIO_ID}`, JSON.stringify(e));
            location.reload();
        };
    </script>
</head>
<body>
    <div id="loader"><div class="relative text-orange-600 animate-bounce"><i data-lucide="pizza" size="48"></i></div><h2 class="italic-black text-2xl mt-4">SLICE DOG</h2></div>

    <div class="max-w-md mx-auto p-6 min-h-screen flex flex-col items-center">
        <header class="py-10 text-center">
            <h1 class="italic-black text-3xl text-neutral-800">SLICE DOG <span class="text-orange-500">CLUB</span></h1>
        </header>

        <main id="main-ui" class="w-full hidden">
            <div class="bg-white rounded-[2.5rem] p-8 shadow-xl border-b-8 border-neutral-200">
                <p id="user-greeting" class="text-[10px] font-black text-neutral-400 mb-4 uppercase text-center"></p>
                
                <div id="stamps-grid" class="grid grid-cols-5 gap-3 mb-8"></div>

                <div id="action-btn-container" class="w-full">
                    </div>
            </div>
            
            <p class="text-[10px] text-center mt-8 font-bold text-neutral-400 uppercase tracking-widest">Presenta tu código en caja para sumar sellos</p>
        </main>
    </div>

    <div id="register-modal" class="fixed inset-0 bg-black/90 backdrop-blur-sm z-[100] flex items-center justify-center p-6 hidden">
        <div class="bg-white w-full max-w-sm rounded-[3rem] p-8 text-center border-t-8 border-orange-500">
            <h2 class="italic-black text-2xl mb-6">Crea tu cuenta</h2>
            <input type="text" id="reg-name" placeholder="Tu Nombre" class="w-full p-4 mb-3 bg-neutral-100 rounded-2xl font-bold text-center outline-none">
            <input type="email" id="reg-email" placeholder="Tu Correo" class="w-full p-4 mb-6 bg-neutral-100 rounded-2xl font-bold text-center outline-none">
            <button id="btn-register" class="w-full py-5 bg-black text-white rounded-[1.8rem] italic-black uppercase">Unirme ahora</button>
        </div>
    </div>
</body>
</html>
