<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slice Dog Club | v6.4 Diseño Corregido</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        :root { --sd-mustard: #eb9a1f; --sd-dark: #4a2311; --sd-bg: #f3e5d0; }
        body { font-family: 'Inter', sans-serif; background-color: var(--sd-bg); color: var(--sd-dark); margin: 0; overflow: hidden; }
        .italic-black { font-weight: 900; font-style: italic; text-transform: uppercase; }
        
        #loader { position: fixed; inset: 0; background: var(--sd-bg); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; transition: opacity 0.8s; }
        .logo-glow-container { width: 140px; height: 140px; background: radial-gradient(circle, rgba(235,154,31,0.4) 0%, rgba(243,229,208,0) 70%); display: flex; align-items: center; justify-content: center; animation: pulseGolden 2s infinite; border-radius: 50%; }
        
        /* Logo restaurado y centrado con transform en lugar de cortar el SVG */
        .custom-logo-svg { width: 115px; height: 115px; fill: var(--sd-mustard); display: block; transform: translate(-2px, -6px); }
        
        @keyframes pulseGolden { 0%, 100% { transform: scale(1); opacity: 0.8; } 50% { transform: scale(1.1); opacity: 1; filter: drop-shadow(0 0 15px var(--sd-mustard)); } }
        
        .stamp-active { background: linear-gradient(135deg, var(--sd-mustard) 0%, #c97e10 100%); color: white; border: none; }
        .coupon-card { min-width: 260px; background: white; border: 2px dashed var(--sd-mustard); border-radius: 1.5rem; padding: 1.5rem; snap-align: center; }
        .locked-ui { opacity: 0.4; pointer-events: none; filter: grayscale(1); }
        #main-ui { overflow-y: auto; height: 100vh; padding-bottom: 80px; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, onSnapshot, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAFwDQVPy4xRjw4rxcKcZEwNx1suV7eWW8",
            authDomain: "slice-dog-test-firebase.firebaseapp.com",
            projectId: "slice-dog-test-firebase",
            storageBucket: "slice-dog-test-firebase.firebasestorage.app",
            messagingSenderId: "1024055139023",
            appId: "1:1024055139023:web:42985e24651b5a5f38f5ba"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const SECRET_SALT = "SD2026"; 
        const BLOQUE_TIEMPO_MS = 180000; 
        const COOLDOWN_TIME = 600000; 

        let userStoredEmail = JSON.parse(localStorage.getItem("sd_user_email"));
        let html5QrCode;
        let activeTimerInterval;
        let globalConfig = { bienvenida_activa: true, cumple_activa: true };

        const hideLoader = () => {
            const l = document.getElementById('loader');
            if(l) { l.style.opacity = '0'; setTimeout(() => l.remove(), 800); }
        };

        onSnapshot(doc(db, "config", "promos"), (snapshot) => {
            if(snapshot.exists()) {
                globalConfig = snapshot.data();
                if(userStoredEmail) {
                    getDoc(doc(db, "users", userStoredEmail)).then(u => { if(u.exists()) renderApp(u.data()); });
                }
            }
        }, (error) => {
            console.error("Error leyendo config:", error);
        });

        async function useCoupon(email, type, name) {
            const userRef = doc(db, "users", email);
            const pin = Math.floor(100 + Math.random() * 900);
            const updateData = { active_pin: pin, pin_type: type, pin_timestamp: Date.now() };
            if(type === 'TABLERO') updateData.stamps = 0;
            else updateData[type] = "PROCESANDO";
            
            await updateDoc(userRef, updateData);
            await addDoc(collection(db, "historial"), { email, nombre: name || "S/D", tipo: type, pin, fecha: new Date(), estado: "GENERADO" });
        }

        window.openScanner = (email, currentStamps) => {
            document.getElementById('scanner-modal').classList.remove('hidden');
            html5QrCode = new Html5Qrcode("reader");
            html5QrCode.start({ facingMode: "environment" }, { fps: 15, qrbox: 250 }, 
                async (text) => {
                    await window.closeScanner();
                    const b1 = Math.floor(Date.now() / BLOQUE_TIEMPO_MS);
                    if (text.trim() === btoa(b1 + "_" + SECRET_SALT) || text.trim() === btoa((b1-1) + "_" + SECRET_SALT)) {
                        localStorage.setItem("sd_last_stamp_time", Date.now());
                        await updateDoc(doc(db, "users", email), { stamps: currentStamps + 1, lastUpdate: new Date() });
                    } else { alert("❌ QR EXPIRADO"); }
                }
            );
        };

        window.closeScanner = async () => {
            if(html5QrCode) { await html5QrCode.stop(); html5QrCode = null; }
            document.getElementById('scanner-modal').classList.add('hidden');
        };

        function renderApp(data) {
            hideLoader();
            document.getElementById('register-modal').classList.add('hidden');
            document.getElementById('main-ui').classList.remove('hidden');
            document.getElementById('user-greeting').innerText = `HOLA, ${data.name} 🍕`;
            
            const statusEl = document.getElementById('status-title');
            const btnContainer = document.getElementById('action-btn-container');
            const rewardsSection = document.getElementById('rewards-section');

            if(activeTimerInterval) clearInterval(activeTimerInterval);

            if (data.active_pin) {
                const limite = 5 * 60 * 1000;
                const updateTimer = () => {
                    const transcurrido = Date.now() - (data.pin_timestamp || 0);
                    const restantes = Math.ceil((limite - transcurrido) / 1000);
                    if (restantes <= 0) {
                        clearInterval(activeTimerInterval);
                        updateDoc(doc(db, "users", data.email), { active_pin: null, pin_timestamp: null, pin_type: null });
                        return;
                    }
                    const m = Math.floor(restantes / 60), s = (restantes % 60).toString().padStart(2, '0');
                    const t = document.getElementById('countdown-text');
                    if(t) t.innerText = `Expira en ${m}:${s}`;
                };
                statusEl.innerText = "MUESTRA EL PIN";
                btnContainer.innerHTML = `
                    <div class="w-full py-5 bg-orange-600 text-white rounded-[1.8rem] italic-black flex flex-col items-center justify-center shadow-lg animate-pulse">
                        <span class="text-4xl tracking-[0.3em] ml-3">${data.active_pin}</span>
                        <span id="countdown-text" class="text-[10px] mt-2 opacity-80 font-bold">Calculando...</span>
                    </div>`;
                rewardsSection.classList.add('locked-ui');
                activeTimerInterval = setInterval(updateTimer, 1000);
                updateTimer();
            } else {
                rewardsSection.classList.remove('locked-ui');
                const currentStamps = data.stamps || 0;
                if (currentStamps >= 10) {
                    statusEl.innerText = "¡PREMIO LISTO!";
                    btnContainer.innerHTML = `<button id="btn-claim" class="w-full py-5 bg-orange-600 text-white rounded-[1.8rem] italic-black shadow-lg">OBTENER PIN</button>`;
                    document.getElementById('btn-claim').onclick = () => useCoupon(data.email, 'TABLERO', data.name);
                } else {
                    statusEl.innerText = `FALTAN ${10 - currentStamps} PARA PREMIO`;
                    btnContainer.innerHTML = `<button id="btn-scan" class="w-full py-5 bg-[var(--sd-mustard)] text-white rounded-[1.8rem] italic-black flex items-center justify-center gap-3 shadow-lg uppercase"><i data-lucide="qr-code"></i> Solicitar Sello</button>`;
                    const lastS = localStorage.getItem("sd_last_stamp_time");
                    if (lastS && (Date.now() - lastS < COOLDOWN_TIME)) startCooldownTimer(COOLDOWN_TIME - (Date.now() - lastS));
                    else document.getElementById('btn-scan').onclick = () => openScanner(data.email, currentStamps);
                }
                const grid = document.getElementById('stamps-grid'); grid.innerHTML = '';
                for(let i=0; i<10; i++) {
                    const active = i < currentStamps;
                    const slot = document.createElement('div');
                    slot.className = `aspect-square rounded-2xl flex items-center justify-center border-2 ${active ? 'stamp-active' : 'border-dashed border-neutral-300 bg-neutral-50/50'}`;
                    slot.innerHTML = active ? (i === 9 ? '<i data-lucide="gift"></i>' : '<i data-lucide="pizza"></i>') : (i === 9 ? '<i data-lucide="gift" class="text-neutral-300"></i>' : '');
                    grid.appendChild(slot);
                }
            }

            const carousel = document.getElementById('rewards-carousel'); carousel.innerHTML = '';
            const cupones = [
                {id:'cupon_bienvenida', t:'🎁 BIENVENIDA', g:'Bebida', active: globalConfig.bienvenida_activa}, 
                {id:'cupon_cumple', t:'🎂 CUMPLE', g:'Rebanada', active: globalConfig.cumple_activa}
            ];
            let visibles = 0;
            cupones.forEach(c => {
                if(data[c.id] === "LISTO" && c.active) {
                    visibles++;
                    const card = document.createElement('div');
                    card.className = 'coupon-card text-center';
                    card.innerHTML = `<p class="text-[9px] font-black text-orange-500 mb-1 uppercase">${c.t}</p><h4 class="italic-black text-lg mb-4 uppercase">${c.g} GRATIS</h4><button class="w-full py-3 bg-black text-white rounded-xl text-[10px] font-black uppercase">Canjear</button>`;
                    card.querySelector('button').onclick = () => { if(confirm('¿Generar PIN?')) useCoupon(data.email, c.id, data.name); };
                    carousel.appendChild(card);
                }
            });
            rewardsSection.style.display = visibles > 0 ? 'block' : 'none';
            lucide.createIcons();
        }

        function startCooldownTimer(ms) {
            const btn = document.getElementById('btn-scan'); if(!btn) return;
            btn.classList.add('opacity-50', 'pointer-events-none');
            let secs = Math.ceil(ms / 1000);
            const inter = setInterval(() => {
                secs--; btn.innerHTML = `<i data-lucide="clock" class="w-4 h-4"></i> ESPERA (${secs}s)`;
                if (secs <= 0) { clearInterval(inter); location.reload(); }
            }, 1000);
        }

        window.onload = () => {
            if(userStoredEmail) { 
                onSnapshot(doc(db, "users", userStoredEmail), (doc) => { if(doc.exists()) renderApp(doc.data()); }); 
            } else { 
                setTimeout(hideLoader, 2500); 
                document.getElementById('register-modal').classList.remove('hidden'); 
            }
            document.getElementById('btn-register').onclick = () => {
                const n = document.getElementById('reg-name').value, e = document.getElementById('reg-email').value.toLowerCase().trim(), w = document.getElementById('reg-whatsapp').value;
                if(n && e && w) {
                    setDoc(doc(db, "users", e), { name: n, email: e, whatsapp: w, stamps: 1, cupon_bienvenida: "LISTO", cupon_cumple: "LISTO", lastUpdate: new Date() })
                    .then(() => { localStorage.setItem("sd_user_email", JSON.stringify(e)); location.reload(); });
                }
            };
            lucide.createIcons();
        };
    </script>
</head>
<body class="min-h-screen flex flex-col items-center">
    <div id="loader">
        <div class="logo-glow-container">
            <svg class="custom-logo-svg" viewBox="0 0 128 128">
                <path d="M47.87,60.71c-9.85-9.55,3.49-25.11,14.53-16.74,12.29,9.31-3.43,27.51-14.53,16.74ZM48.68,46.12c-10.17,10.69,9.16,23.63,15.43,11.21,5.11-10.11-7.98-19.04-15.43-11.21Z"/>
                <path d="M100.59,8.2c-3.2-2.53-7.31-2.84-11.26-3.22-18.61-1.8-41.4,1.28-57.8,10.53-5.35,3.01-15.55,9.39-16.32,15.84-1.11,9.32,7.16,17.31,16.44,15.03,8.74-10.86,28.56-14.65,41.8-15.29,6.1-.29,16.97,1.47,22.02-.89,10.4,1.77,13.94,14.04,5.46,19.81Z"/>
            </svg>
        </div>
        <h2 class="italic-black text-2xl mt-4 tracking-tighter">SLICE DOG</h2>
    </div>

    <header class="w-full max-w-md text-center py-8">
        <h1 class="italic-black text-2xl tracking-tighter">Slice Dog <span class="text-orange-600">Club</span></h1>
    </header>

    <main id="main-ui" class="w-full max-w-md hidden px-4">
        <div class="bg-white rounded-[2.5rem] p-8 text-center shadow-xl mb-8 border-b-8 border-orange-500/5">
            <p id="user-greeting" class="text-[10px] font-black text-neutral-400 mb-2 tracking-widest uppercase"></p>
            <h2 id="status-title" class="italic-black text-3xl mb-8 leading-none"></h2>
            <div id="stamps-grid" class="grid grid-cols-5 gap-3 mb-8"></div>
            <div id="action-btn-container"></div>
        </div>

        <div id="rewards-section" class="w-full overflow-hidden mb-10">
            <h3 class="text-[10px] font-black text-neutral-400 mb-3 px-2 tracking-widest uppercase">Premios Especiales</h3>
            <div id="rewards-carousel" class="flex gap-4 overflow-x-auto pb-6 px-2 snap-x scrollbar-hide"></div>
        </div>
    </main>

    <div id="register-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-[100] flex items-center justify-center p-6 hidden">
        <div class="bg-white w-full max-w-sm rounded-[3rem] p-8 text-center border-4 border-orange-400">
            <h2 class="italic-black text-2xl mb-6">Únete al Club</h2>
            <input type="text" id="reg-name" placeholder="Nombre" class="w-full p-4 mb-3 bg-neutral-100 rounded-2xl font-bold text-center border-none outline-none text-sm">
            <input type="email" id="reg-email" placeholder="Correo" class="w-full p-4 mb-3 bg-neutral-100 rounded-2xl font-bold text-center border-none outline-none text-sm">
            <input type="tel" id="reg-whatsapp" placeholder="WhatsApp" class="w-full p-4 mb-6 bg-neutral-100 rounded-2xl font-bold text-center border-none outline-none text-sm">
            <button id="btn-register" class="w-full py-5 bg-black text-white rounded-[1.8rem] italic-black">EMPEZAR AHORA</button>
        </div>
    </div>
    <div id="scanner-modal" class="fixed inset-0 bg-black/95 z-[200] flex flex-col items-center justify-center p-6 hidden">
        <div class="w-full max-w-sm bg-white rounded-[3rem] p-4 text-center">
            <div id="reader"></div>
            <button onclick="closeScanner()" class="mt-4 py-4 text-xs font-black text-neutral-400 uppercase">Cerrar</button>
        </div>
    </div>
</body>
</html>
