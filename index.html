<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slice Dog Club | v6.0 Nexus</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        :root { --sd-mustard: #eb9a1f; --sd-dark: #4a2311; --sd-bg: #f3e5d0; }
        body { font-family: 'Inter', sans-serif; background-color: var(--sd-bg); color: var(--sd-dark); margin: 0; overflow: hidden; }
        .italic-black { font-weight: 900; font-style: italic; text-transform: uppercase; }
        
        /* --- SPLASH SCREEN --- */
        #loader {
            position: fixed; inset: 0; background: var(--sd-bg);
            display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000;
            transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .logo-glow-container {
            width: 180px; height: 180px;
            background: radial-gradient(circle, rgba(235,154,31,0.45) 0%, rgba(235,154,31,0.1) 50%, rgba(243,229,208,0) 75%);
            display: flex; align-items: center; justify-content: center;
            border-radius: 50%; animation: pulseGolden 2.2s ease-in-out infinite;
        }
        .custom-logo-svg { width: 115px; height: 115px; filter: drop-shadow(0 6px 12px rgba(0,0,0,0.15)); }
        .custom-logo-svg path, .custom-logo-svg polygon {
            fill: var(--sd-mustard); stroke: var(--sd-mustard);
            stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
        }
        @keyframes pulseGolden { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); filter: drop-shadow(0 0 35px rgba(235,154,31,0.6)); } }
        
        .dot-flashing { display: inline-flex; gap: 6px; margin-top: 25px; }
        .dot { width: 9px; height: 9px; background: #d1c1aa; border-radius: 50%; animation: dotAnim 1.4s infinite; }
        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes dotAnim { 0%, 100% { opacity: 0.3; transform: translateY(0); } 50% { opacity: 1; transform: translateY(-4px); } }

        /* --- ESTILOS APP --- */
        .stamp-active { background: linear-gradient(135deg, var(--sd-mustard) 0%, #c97e10 100%); color: white; border: none; }
        .coupon-card { min-width: 260px; background: white; border: 2px dashed var(--sd-mustard); border-radius: 1.5rem; padding: 1.5rem; snap-align: center; }
        .locked-ui { opacity: 0.4; pointer-events: none; filter: grayscale(1); }
        #main-ui { overflow-y: auto; height: 100vh; padding-bottom: 60px; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        // Añadimos collection y addDoc para el historial
        import { getFirestore, doc, getDoc, setDoc, updateDoc, onSnapshot, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAFwDQVPy4xRjw4rxcKcZEwNx1suV7eWW8",
            authDomain: "slice-dog-test-firebase.firebaseapp.com",
            projectId: "slice-dog-test-firebase",
            storageBucket: "slice-dog-test-firebase.firebasestorage.app",
            messagingSenderId: "1024055139023",
            appId: "1:1024055139023:web:42985e24651b5a5f38f5ba"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const SECRET_SALT = "SD2026"; 
        const BLOQUE_TIEMPO_MS = 180000; 
        const COOLDOWN_TIME = 600000; 

        let userStoredEmail = JSON.parse(localStorage.getItem("sd_user_email"));
        let html5QrCode;

        const hideLoader = () => {
            const l = document.getElementById('loader');
            if(l) { l.style.opacity = '0'; setTimeout(() => l.remove(), 800); }
        };

        async function useCoupon(email, type, name) {
            const userRef = doc(db, "users", email);
            const snap = await getDoc(userRef);
            if (snap.exists() && snap.data().active_pin) { alert("⚠️ YA TIENES UN CANJE ACTIVO"); return; }
            
            const pin = Math.floor(100 + Math.random() * 900);
            if(confirm(`¿Generar PIN de canje?`)) {
                const updateData = { active_pin: pin, pin_type: type, pin_timestamp: Date.now() };
                if(type === 'TABLERO') updateData.stamps = 0;
                else updateData[type] = "PROCESANDO";
                
                await updateDoc(userRef, updateData);

                // REGISTRO EN HISTORIAL (Punto de Agenda)
                await addDoc(collection(db, "historial"), {
                    email: email,
                    nombre: name || "S/D",
                    tipo: type,
                    pin: pin,
                    fecha: new Date(),
                    estado: "GENERADO"
                });
            }
        }

        window.openScanner = (email, currentStamps) => {
            document.getElementById('scanner-modal').classList.remove('hidden');
            html5QrCode = new Html5Qrcode("reader");
            html5QrCode.start({ facingMode: "environment" }, { fps: 15, qrbox: 250 }, 
                async (text) => {
                    await window.closeScanner();
                    const b1 = Math.floor(Date.now() / BLOQUE_TIEMPO_MS);
                    if (text.trim() === btoa(b1 + "_" + SECRET_SALT) || text.trim() === btoa((b1-1) + "_" + SECRET_SALT)) {
                        localStorage.setItem("sd_last_stamp_time", Date.now());
                        await updateDoc(doc(db, "users", email), { stamps: currentStamps + 1, lastUpdate: new Date() });
                    } else { alert("❌ QR EXPIRADO"); }
                }
            );
        };

        window.closeScanner = async () => {
            if(html5QrCode) { await html5QrCode.stop(); html5QrCode = null; }
            document.getElementById('scanner-modal').classList.add('hidden');
        };

        function renderApp(data) {
            hideLoader();
            document.getElementById('register-modal').classList.add('hidden');
            document.getElementById('main-ui').classList.remove('hidden');
            document.getElementById('user-greeting').innerText = `HOLA, ${data.name} 🍕`;
            
            const statusEl = document.getElementById('status-title');
            const btnContainer = document.getElementById('action-btn-container');
            const rewardsSection = document.getElementById('rewards-section');

            if (data.active_pin) {
                const transcurrido = Date.now() - (data.pin_timestamp || 0);
                const limite = 5 * 60 * 1000;
                if (transcurrido > limite) {
                    const userRef = doc(db, "users", data.email);
                    const reset = { active_pin: null, pin_timestamp: null, pin_type: null };
                    if(data.pin_type === 'TABLERO') reset.stamps = 10;
                    else reset[data.pin_type] = "LISTO";
                    updateDoc(userRef, reset);
                    return;
                }
                const restantes = Math.ceil((limite - transcurrido) / 1000);
                statusEl.innerText = "MUESTRA EL PIN";
                btnContainer.innerHTML = `<div class="w-full py-5 bg-orange-600 text-white rounded-[1.8rem] italic-black flex flex-col items-center justify-center shadow-lg animate-pulse"><span class="text-4xl tracking-[0.3em] ml-3">${data.active_pin}</span><span class="text-[10px] mt-2 opacity-80 font-bold uppercase">Expira en ${Math.floor(restantes/60)}:${(restantes%60).toString().padStart(2,'0')}</span></div>`;
                rewardsSection.classList.add('locked-ui');
            } else {
                rewardsSection.classList.remove('locked-ui');
                const currentStamps = data.stamps || 0;
                if (currentStamps >= 10) {
                    statusEl.innerText = "¡PREMIO LISTO!";
                    btnContainer.innerHTML = `<button id="btn-claim" class="w-full py-5 bg-orange-600 text-white rounded-[1.8rem] italic-black shadow-lg">OBTENER PIN</button>`;
                    document.getElementById('btn-claim').onclick = () => useCoupon(data.email, 'TABLERO', data.name);
                } else {
                    statusEl.innerText = `FALTAN ${10 - currentStamps} PARA PREMIO`;
                    btnContainer.innerHTML = `<button id="btn-scan" class="w-full py-5 bg-[var(--sd-mustard)] text-white rounded-[1.8rem] italic-black flex items-center justify-center gap-3 shadow-lg uppercase"><i data-lucide="qr-code"></i> Solicitar Sello</button>`;
                    const lastS = localStorage.getItem("sd_last_stamp_time");
                    if (lastS && (Date.now() - lastS < COOLDOWN_TIME)) startCooldownTimer(COOLDOWN_TIME - (Date.now() - lastS));
                    else document.getElementById('btn-scan').onclick = () => openScanner(data.email, currentStamps);
                }
                const grid = document.getElementById('stamps-grid'); grid.innerHTML = '';
                for(let i=0; i<10; i++) {
                    const active = i < currentStamps;
                    const slot = document.createElement('div');
                    slot.className = `aspect-square rounded-2xl flex items-center justify-center border-2 ${active ? 'stamp-active' : 'border-dashed border-neutral-300 bg-neutral-50/50'}`;
                    slot.innerHTML = active ? (i === 9 ? '<i data-lucide="gift"></i>' : '<i data-lucide="pizza"></i>') : (i === 9 ? '<i data-lucide="gift" class="text-neutral-300"></i>' : '');
                    grid.appendChild(slot);
                }
            }
            // RENDER CUPONES
            const carousel = document.getElementById('rewards-carousel'); carousel.innerHTML = '';
            const cupones = [{id:'cupon_bienvenida', t:'🎁 BIENVENIDA', g:'Bebida'}, {id:'cupon_cumple', t:'🎂 CUMPLE', g:'Rebanada'}];
            cupones.forEach(c => {
                if(data[c.id] === "LISTO") {
                    const card = document.createElement('div');
                    card.className = 'coupon-card text-center';
                    card.innerHTML = `<p class="text-[9px] font-black text-orange-500 mb-1 uppercase">${c.t}</p><h4 class="italic-black text-lg mb-4 uppercase">${c.g} GRATIS</h4><button class="w-full py-3 bg-black text-white rounded-xl text-[10px] font-black uppercase">Canjear</button>`;
                    card.querySelector('button').onclick = () => useCoupon(data.email, c.id, data.name);
                    carousel.appendChild(card);
                }
            });
            lucide.createIcons();
        }

        function startCooldownTimer(ms) {
            const btn = document.getElementById('btn-scan'); if(!btn) return;
            btn.classList.add('opacity-50', 'pointer-events-none');
            let secs = Math.ceil(ms / 1000);
            const inter = setInterval(() => {
                secs--; btn.innerHTML = `<i data-lucide="clock" class="w-4 h-4"></i> ESPERA (${secs}s)`;
                if (secs <= 0) { clearInterval(inter); location.reload(); }
            }, 1000);
        }

        window.onload = () => {
            if(userStoredEmail) { onSnapshot(doc(db, "users", userStoredEmail), (doc) => { if(doc.exists()) renderApp(doc.data()); }); }
            else { setTimeout(hideLoader, 2500); document.getElementById('register-modal').classList.remove('hidden'); }
            
            document.getElementById('btn-register').onclick = () => {
                const n = document.getElementById('reg-name').value, 
                      e = document.getElementById('reg-email').value.toLowerCase().trim(), 
                      w = document.getElementById('reg-whatsapp').value;
                if(n && e && w) {
                    setDoc(doc(db, "users", e), { 
                        name: n, 
                        email: e, 
                        whatsapp: w, 
                        stamps: 1, 
                        cupon_bienvenida: "LISTO", 
                        cupon_cumple: "LISTO", 
                        lastUpdate: new Date() 
                    }).then(() => { 
                        localStorage.setItem("sd_user_email", JSON.stringify(e)); 
                        location.reload(); 
                    });
                }
            };
            lucide.createIcons();
        };
    </script>
</head>
<body class="min-h-screen flex flex-col items-center">

        <div class="logo-glow-container">
            <svg class="custom-logo-svg" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
                <g><path d="M93.14,66.4v.02l1.45.33.03-.17-1.48-.18Z"/><path d="M47.87,60.71c-9.85-9.55,3.49-25.11,14.53-16.74,12.29,9.31-3.43,27.51-14.53,16.74ZM48.68,46.12c-10.17,10.69,9.16,23.63,15.43,11.21,5.11-10.11-7.98-19.04-15.43-11.21Z"/><path d="M68.76,70.23c3.81-4.51,10.74,1.02,7.3,5.9s-11.42-1.02-7.3-5.9ZM74.94,71.43c-2.59-3.52-8.52,1.14-4.51,4.31,3.08,2.43,6.42-1.7,4.51-4.31Z"/><path d="M57.38,21.86v1.6c-10.03.52-19.44,5.37-26.38,12.44l-1.35-.97c7.44-7.35,17.17-12.24,27.73-13.06Z"/></g>
                <g><path d="M100.59,8.2c-3.2-2.53-7.31-2.84-11.26-3.22-18.61-1.8-41.4,1.28-57.8,10.53-5.35,3.01-15.55,9.39-16.32,15.84-1.11,9.32,7.16,17.31,16.44,15.03-1.42,3.21-.48,1.72.75,3.48,3.44,4.93-4.83,10.93-1.15,16.42,2.08,3.12,6.57,2.23,6.85-2.02.09-1.43-1.16-4.8,1.07-5.36,2.69-.67,4.29,6.33,4.49,8.24.91,8.65-3.28,14.24-4.99,21.84-1.07,4.76-.94,11.27,5.65,10.48,6.3-.76,5.43-11.46,5.83-15.89.14-1.62.34-5.52.9-6.73,1.09-2.36,3.5-.94,4.39,1.03,2.66,5.88,1.24,16.65-.76,22.7-2.21,6.68-7.38,10.62-1.89,17.74,6.36,8.25,17.17,4.85,14.99-6.15l-4.2-23.58c4.11-1.77,7.25,5.8,7.48,9.04.16,2.27-1.36,7.61,1.89,8.2,2.77.5,3.08-3.54,4.12-2.75.38,1.66,1.18,3.27,1.24,5.02.16,4.58-3.68,8.65-.76,13.2,1.31,2.06,3.73,2.88,5.92,1.64,3.59-2.02.27-6.13.89-9.17l4.78-23.16c-9.43.2-13.23-12.44-5.36-17.62,3.31-2.18,6.13-1.56,9.78-.87l1.03-5.36-1.45-.33-.79,4.09c-8.65-2.4-16.52,5.23-13.79,13.98,1.21,3.86,4.85,7.24,8.97,7.32l-4.79,22.78c.34,2.55,2.84,8.89-2.47,7.19-5.1-1.63-.37-10.04-.35-13.29.01-1.98-1.93-9.26-4.75-6.52-.61.59-.88,3.9-2.55,1.73-.97-1.25.1-3.97.04-5.64-.09-2.76-1.37-6.05-3.06-8.23-2-2.58-5.78-5.28-7.63-1.04l4.63,26.88c-1.26,8.23-8.95,6.86-12.83,1.26-4.58-6.6.5-10.06,2.52-16.36,1.85-5.8,3.09-17.46.71-23.06-2.21-5.19-7.32-4.36-8.01,1.69-.52,4.5.46,15.6-3.47,18.24-2.44,1.64-5.38.01-5.81-2.64-.83-5.16,4-14.47,5.02-20.26.79-4.43.82-7.56-.61-11.88-.73-2.2-1.95-5.24-4.7-5.32-4.55-.14-2.07,6.97-3.31,8.58-2.08,1.92-4.23-.23-4.44-2.5-.4-4.26,4.37-7.63,2.92-12.55-.91-3.1-3.04-1.84.07-5.7,8.74-10.86,28.56-14.65,41.8-15.29,6.1-.29,16.97,1.47,22.02-.89,1.4-.66,2.31-1.83,3.52-2.71l-1.51,7.16-.06.27-7.29,32.69,1.48.18-.03.17,7.36-32.98c.96-8.82,7.32-18.7-1.36-25.57ZM99.16,26.86c-4.86,3.31-15.64,1.14-21.88,1.44-12.7.6-29.23,3.66-39.39,11.66-2.53,1.99-3.92,4.74-7.28,5.18-3.47.46-7.44-.62-10.08-2.92-3.62-3.16-5.25-10.42-2.55-14.54,1.9-2.91,10.17-8.46,13.4-10.31C48.44,7.59,74.37,3.76,93.7,7.05c10.4,1.77,13.94,14.04,5.46,19.81Z"/><polygon points="94.62 66.58 94.59 66.75 93.14 66.42 93.13 66.42 93.14 66.4 94.62 66.58"/></g>
            </svg>
        </div>
        <h2 class="italic-black text-3xl mt-6 tracking-tighter">SLICE DOG</h2>
        <div class="dot-flashing"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
    </div>

    <header class="w-full max-w-md text-center py-10">
        <h1 class="italic-black text-2xl tracking-tighter">Slice Dog <span class="text-orange-600">Club</span></h1>
    </header>

    <main id="main-ui" class="w-full max-w-md hidden px-4">
        <div class="bg-white rounded-[2.5rem] p-8 text-center shadow-xl mb-8 border-b-8 border-orange-500/5">
            <p id="user-greeting" class="text-[10px] font-black text-neutral-400 mb-2 tracking-widest uppercase"></p>
            <h2 id="status-title" class="italic-black text-3xl mb-8 leading-none"></h2>
            <div id="stamps-grid" class="grid grid-cols-5 gap-3 mb-8"></div>
            <div id="action-btn-container"></div>
        </div>

        <div id="rewards-section" class="w-full overflow-hidden mb-10">
            <h3 class="text-[10px] font-black text-neutral-400 mb-3 px-2 tracking-widest uppercase">Premios Especiales</h3>
            <div id="rewards-carousel" class="flex gap-4 overflow-x-auto pb-6 px-2 snap-x scrollbar-hide">
                </div>
        </div>
    </main>

    <div id="register-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-[100] flex items-center justify-center p-6 hidden">
        <div class="bg-white w-full max-w-sm rounded-[3rem] p-8 text-center border-4 border-orange-400 shadow-2xl">
            <h2 class="italic-black text-2xl mb-6 leading-none">Únete al Club</h2>
            <input type="text" id="reg-name" placeholder="Tu Nombre" class="w-full p-4 mb-3 bg-neutral-100 rounded-2xl font-bold text-center border-none outline-none">
            <input type="email" id="reg-email" placeholder="Tu Correo" class="w-full p-4 mb-3 bg-neutral-100 rounded-2xl font-bold text-center border-none outline-none">
            <input type="tel" id="reg-whatsapp" placeholder="WhatsApp" class="w-full p-4 mb-6 bg-neutral-100 rounded-2xl font-bold text-center border-none outline-none">
            <button id="btn-register" class="w-full py-5 bg-black text-white rounded-[1.8rem] italic-black shadow-lg">EMPEZAR AHORA</button>
        </div>
    </div>

    <div id="scanner-modal" class="fixed inset-0 bg-black/95 z-[200] flex flex-col items-center justify-center p-6 hidden">
        <div class="w-full max-w-sm bg-white rounded-[3rem] p-4 text-center">
            <div id="reader"></div>
            <button onclick="closeScanner()" class="mt-4 py-4 text-xs font-black text-neutral-400 uppercase">Cerrar</button>
        </div>
    </div>

</body>
</html>
