<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, getDoc, setDoc, updateDoc, onSnapshot, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAFwDQVPy4xRjw4rxcKcZEwNx1suV7eWW8",
        authDomain: "slice-dog-test-firebase.firebaseapp.com",
        projectId: "slice-dog-test-firebase",
        storageBucket: "slice-dog-test-firebase.firebasestorage.app",
        messagingSenderId: "1024055139023",
        appId: "1:1024055139023:web:42985e24651b5a5f38f5ba"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    
    // --- IDENTIDAD SAAS ---
    const COMERCIO_ID = "slice-dog-001"; 
    
    const SECRET_SALT = "SD2026"; 
    const BLOQUE_TIEMPO_MS = 180000; 
    const COOLDOWN_TIME = 600000; 

    let userStoredEmail = JSON.parse(localStorage.getItem("sd_user_email"));
    let html5QrCode;
    let activeTimerInterval;
    let globalConfig = { bienvenida_activa: true, cumple_activa: true };

    const hideLoader = () => {
        const l = document.getElementById('loader');
        if(l) { l.style.opacity = '0'; setTimeout(() => l.remove(), 800); }
    };

    // Escuchar promos (También filtradas por comercio en el futuro si quieres)
    onSnapshot(doc(db, "config", "promos"), (snapshot) => {
        if(snapshot.exists()) {
            globalConfig = snapshot.data();
            if(userStoredEmail) {
                getDoc(doc(db, "users", userStoredEmail)).then(u => { if(u.exists()) renderApp(u.data()); });
            }
        }
    });

    async function useCoupon(email, type, name) {
        const userRef = doc(db, "users", email);
        const pin = Math.floor(100 + Math.random() * 900);
        const updateData = { 
            active_pin: pin, 
            pin_type: type, 
            pin_timestamp: Date.now(),
            comercio_id: COMERCIO_ID // Aseguramos que el movimiento es de este comercio
        };
        if(type === 'TABLERO') updateData.stamps = 0;
        else updateData[type] = "PROCESANDO";
        
        await updateDoc(userRef, updateData);
        // Historial con ID de comercio para métricas en Admin
        await addDoc(collection(db, "historial"), { 
            email, 
            nombre: name || "S/D", 
            tipo: type, 
            pin, 
            fecha: new Date(), 
            estado: "GENERADO",
            comercio_id: COMERCIO_ID 
        });
    }

    // ... (Funciones de Scanner se mantienen igual) ...

    window.onload = () => {
        if(userStoredEmail) { 
            onSnapshot(doc(db, "users", userStoredEmail), (doc) => { 
                if(doc.exists()) renderApp(doc.data()); 
            }); 
        } else { 
            setTimeout(hideLoader, 2500); 
            document.getElementById('register-modal').classList.remove('hidden'); 
        }

        document.getElementById('btn-register').onclick = async () => {
            const n = document.getElementById('reg-name').value;
            const e = document.getElementById('reg-email').value.toLowerCase().trim();
            const w = document.getElementById('reg-whatsapp').value;

            if(!e) { alert("Por favor ingresa tu correo"); return; }

            const userRef = doc(db, "users", e);
            const userSnap = await getDoc(userRef);

            if (userSnap.exists()) {
                localStorage.setItem("sd_user_email", JSON.stringify(e));
                location.reload();
            } else {
                if(n && w) {
                    await setDoc(userRef, { 
                        name: n, 
                        email: e, 
                        whatsapp: w, 
                        stamps: 1, 
                        comercio_id: COMERCIO_ID, // <--- MARCA DE AGUA AL REGISTRAR
                        cupon_bienvenida: "LISTO", 
                        cupon_cumple: "LISTO", 
                        lastUpdate: new Date() 
                    });
                    localStorage.setItem("sd_user_email", JSON.stringify(e));
                    location.reload();
                } else {
                    alert("Para clientes nuevos, necesitamos nombre y WhatsApp.");
                }
            }
        };
        lucide.createIcons();
    };
    // ... (RenderApp se mantiene igual, ya lee del documento 'data' de Firebase) ...
</script>
