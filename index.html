<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title id="page-title">Cargando Club...</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        :root { --sd-mustard: #eb9a1f; --sd-dark: #4a2311; --sd-bg: #f3e5d0; }
        body { font-family: 'Inter', sans-serif; background-color: var(--sd-bg); color: var(--sd-dark); margin: 0; padding: 0; width: 100%; overflow-x: hidden; }
        .italic-black { font-weight: 900; font-style: italic; text-transform: uppercase; }
        
        #loader { position: fixed; inset: 0; background: var(--sd-bg); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; transition: opacity 0.8s; }
        .app-container { width: 100%; max-width: 450px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 0 20px; }
        .stamp-active { background: linear-gradient(135deg, var(--sd-mustard) 0%, #c97e10 100%); color: white; border: none; }
        .coupon-card { min-width: 260px; background: white; border: 2px dashed var(--sd-mustard); border-radius: 1.5rem; padding: 1.5rem; snap-align: center; margin-right: 15px; flex-shrink: 0; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        
        /* Estilos para Modales */
        .modal-blur { backdrop-filter: blur(8px); background: rgba(0,0,0,0.7); }
        .glass-card { background: rgba(255, 255, 255, 0.95); border-radius: 2.5rem; }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, onSnapshot, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAFwDQVPy4xRjw4rxcKcZEwNx1suV7eWW8",
            authDomain: "slice-dog-test-firebase.firebaseapp.com",
            projectId: "slice-dog-test-firebase",
            storageBucket: "slice-dog-test-firebase.firebasestorage.app",
            messagingSenderId: "1024055139023",
            appId: "1:1024055139023:web:42985e24651b5a5f38f5ba"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        const urlParams = new URLSearchParams(window.location.search);
        const COMERCIO_ID = urlParams.get('id') || 'slicedog'; 
        
        const SECRET_SALT = "SD2026"; 
        const BLOQUE_TIEMPO_MS = 180000; 
        const COOLDOWN_TIME = 600000; 

        let userStoredEmail = JSON.parse(localStorage.getItem(`sd_user_${COMERCIO_ID}`));
        let globalConfig = {};
        let popupMostrado = false;

        const hideLoader = () => {
            const l = document.getElementById('loader');
            if(l) { l.style.opacity = '0'; setTimeout(() => l.remove(), 800); }
        };

        // Escuchar configuración
        onSnapshot(doc(db, "config", "promos"), (snapshot) => {
            if(snapshot.exists()) {
                globalConfig = snapshot.data();
                actualizarUIEstatica();
                if(userStoredEmail) fetchUserData(userStoredEmail);
                
                // Lógica del Popup Inicial
                if(globalConfig.popup_activo && !popupMostrado) {
                    mostrarPopup(globalConfig.popup_texto);
                    popupMostrado = true;
                }
            }
        });

        function actualizarUIEstatica() {
            document.getElementById('page-title').innerText = `${globalConfig.nombre_comercio || 'Club'}`;
            document.getElementById('brand-name').innerHTML = `${globalConfig.nombre_comercio || 'Club'} <span class="text-orange-600">Club</span>`;
            document.getElementById('reglas-content').innerText = globalConfig.reglas_club || "Sin reglas definidas.";
        }

        async function fetchUserData(email) {
            const u = await getDoc(doc(db, "users", email));
            if(u.exists() && u.data().comercio_id === COMERCIO_ID) renderApp(u.data());
        }

        function renderApp(data) {
            hideLoader();
            document.getElementById('register-modal').classList.add('hidden');
            document.getElementById('main-ui').classList.remove('hidden');
            document.getElementById('user-greeting').innerText = `HOLA, ${data.name} 🍕`;
            
            // Render del carrusel de premios mejorado
            renderCarousel(data);
            
            // Lógica de sellos (mantenemos la de ayer)
            const statusEl = document.getElementById('status-title');
            const btnContainer = document.getElementById('action-btn-container');
            const currentStamps = data.stamps || 0;

            if (data.active_pin) {
                statusEl.innerText = "MUESTRA EL PIN";
                btnContainer.innerHTML = `<div class="w-full py-5 bg-orange-600 text-white rounded-[1.8rem] italic-black flex flex-col items-center justify-center animate-pulse"><span class="text-4xl tracking-[0.3em]">${data.active_pin}</span></div>`;
            } else {
                if (currentStamps >= 10) {
                    statusEl.innerText = "¡PREMIO LISTO!";
                    btnContainer.innerHTML = `<button onclick="window.useCoupon('${data.email}', 'TABLERO', '${data.name}')" class="w-full py-5 bg-orange-600 text-white rounded-[1.8rem] italic-black shadow-lg">OBTENER PIN</button>`;
                } else {
                    statusEl.innerText = `FALTAN ${10 - currentStamps} PARA PREMIO`;
                    btnContainer.innerHTML = `<button id="btn-scan" class="w-full py-5 bg-[var(--sd-mustard)] text-white rounded-[1.8rem] italic-black flex items-center justify-center gap-3 shadow-lg uppercase"><i data-lucide="qr-code"></i> Solicitar Sello</button>`;
                    document.getElementById('btn-scan').onclick = () => window.openScanner(data.email, currentStamps);
                }
            }

            const grid = document.getElementById('stamps-grid'); grid.innerHTML = '';
            for(let i=0; i<10; i++) {
                const active = i < currentStamps;
                const slot = document.createElement('div');
                slot.className = `aspect-square rounded-2xl flex items-center justify-center border-2 ${active ? 'stamp-active' : 'border-dashed border-neutral-300 bg-neutral-50/50'}`;
                slot.innerHTML = active ? (i === 9 ? '<i data-lucide="gift"></i>' : '<i data-lucide="pizza"></i>') : '';
                grid.appendChild(slot);
            }
            lucide.createIcons();
        }

        function renderCarousel(data) {
            const carousel = document.getElementById('rewards-carousel');
            carousel.innerHTML = '';
            const dias = ["DOMINGO", "LUNES", "MARTES", "MIÉRCOLES", "JUEVES", "VIERNES", "SÁBADO"];
            const hoy = dias[new Date().getDay()];

            // 1. Cupón del Día (Si está activo en Firebase)
            if(globalConfig.promo_dia_activa) {
                const dayCard = document.createElement('div');
                dayCard.className = 'coupon-card border-orange-500 bg-orange-50/30';
                dayCard.innerHTML = `<p class="text-[9px] font-black text-orange-600 mb-1">ESPECIAL DE ${hoy}</p><h4 class="italic-black text-lg mb-4">${globalConfig.popup_texto || 'PROMO HOY'}</h4><button class="w-full py-3 bg-orange-600 text-white rounded-xl text-[10px] font-black uppercase">Pedir en Caja</button>`;
                carousel.appendChild(dayCard);
            }

            // 2. Cupones Fijos (Bienvenida/Cumple)
            const cupones = [
                {id:'cupon_bienvenida', t:'🎁 BIENVENIDA', g:'Bebida Gratis', active: globalConfig.bienvenida_activa}, 
                {id:'cupon_cumple', t:'🎂 CUMPLE', g:'Rebanada Gratis', active: globalConfig.cumple_activa}
            ];
            cupones.forEach(c => {
                if(data[c.id] === "LISTO" && c.active) {
                    const card = document.createElement('div');
                    card.className = 'coupon-card';
                    card.innerHTML = `<p class="text-[9px] font-black text-neutral-400 mb-1">${c.t}</p><h4 class="italic-black text-lg mb-4">${c.g}</h4><button onclick="window.useCoupon('${data.email}', '${c.id}', '${data.name}')" class="w-full py-3 bg-black text-white rounded-xl text-[10px] font-black uppercase">Canjear</button>`;
                    carousel.appendChild(card);
                }
            });

            // 3. Tarjeta de Google Review
            if(globalConfig.google_review_url) {
                const reviewCard = document.createElement('div');
                reviewCard.className = 'coupon-card border-amber-400 bg-amber-50';
                reviewCard.innerHTML = `<div class="flex justify-center gap-1 mb-2 text-amber-500"><i data-lucide="star" class="w-3 h-3 fill-current"></i><i data-lucide="star" class="w-3 h-3 fill-current"></i><i data-lucide="star" class="w-3 h-3 fill-current"></i><i data-lucide="star" class="w-3 h-3 fill-current"></i><i data-lucide="star" class="w-3 h-3 fill-current"></i></div><h4 class="italic-black text-sm mb-4">¿Te gusta el Club?</h4><a href="${globalConfig.google_review_url}" target="_blank" class="block w-full py-3 bg-amber-500 text-white rounded-xl text-[10px] font-black text-center uppercase">Danos 5 estrellas</a>`;
                carousel.appendChild(reviewCard);
            }
            lucide.createIcons();
        }

        // --- FUNCIONES GLOBALES ---
        window.mostrarPopup = (msg) => {
            document.getElementById('popup-text').innerText = msg;
            document.getElementById('popup-modal').classList.remove('hidden');
        };
        window.cerrarPopup = () => document.getElementById('popup-modal').classList.add('hidden');
        
        window.abrirReglas = () => document.getElementById('reglas-modal').classList.remove('hidden');
        window.cerrarReglas = () => document.getElementById('reglas-modal').classList.add('hidden');

        window.useCoupon = async (email, type, name) => {
            if(!confirm("¿Generar PIN de canje?")) return;
            const pin = Math.floor(100 + Math.random() * 900);
            const updateData = { active_pin: pin, pin_type: type, pin_timestamp: Date.now() };
            if(type === 'TABLERO') updateData.stamps = 0; else updateData[type] = "PROCESANDO";
            await updateDoc(doc(db, "users", email), updateData);
            await addDoc(collection(db, "historial"), { email, nombre: name, tipo: type, pin, fecha: new Date(), comercio_id: COMERCIO_ID });
        };

        window.openScanner = (email, currentStamps) => {
            document.getElementById('scanner-modal').classList.remove('hidden');
            let scanner = new Html5Qrcode("reader");
            scanner.start({ facingMode: "environment" }, { fps: 15, qrbox: 250 }, async (text) => {
                await scanner.stop();
                document.getElementById('scanner-modal').classList.add('hidden');
                const b1 = Math.floor(Date.now() / BLOQUE_TIEMPO_MS);
                if (text.trim() === btoa(b1 + "_" + SECRET_SALT) || text.trim() === btoa((b1-1) + "_" + SECRET_SALT)) {
                    await updateDoc(doc(db, "users", email), { stamps: currentStamps + 1 });
                    localStorage.setItem(`sd_last_stamp_${COMERCIO_ID}`, Date.now());
                    location.reload();
                } else alert("QR EXPIRADO");
            });
        };

        window.onload = () => {
            if(!userStoredEmail) { setTimeout(hideLoader, 2000); document.getElementById('register-modal').classList.remove('hidden'); }
            
            document.getElementById('btn-register').onclick = async () => {
                const n = document.getElementById('reg-name').value, e = document.getElementById('reg-email').value.toLowerCase().trim(), w = document.getElementById('reg-whatsapp').value;
                if(!e || !n) return alert("Nombre y Correo son obligatorios");
                const userRef = doc(db, "users", e);
                const snap = await getDoc(userRef);
                if(!snap.exists()) {
                    await setDoc(userRef, { name: n, email: e, whatsapp: w, stamps: 1, cupon_bienvenida: "LISTO", cupon_cumple: "LISTO", comercio_id: COMERCIO_ID });
                }
                localStorage.setItem(`sd_user_${COMERCIO_ID}`, JSON.stringify(e));
                location.reload();
            };
        };
    </script>
</head>
<body>
    <div id="loader">
        <div class="animate-bounce mb-4 text-orange-500"><i data-lucide="pizza" class="w-12 h-12"></i></div>
        <h2 class="italic-black text-xl">SLICE DOG CLUB</h2>
    </div>

    <div class="app-container">
        <header class="w-full text-center py-8">
            <h1 id="brand-name" class="italic-black text-2xl tracking-tighter italic">Cargando...</h1>
            <button onclick="abrirReglas()" class="text-[9px] font-black text-orange-600/50 uppercase tracking-widest mt-1">Ver reglas del club</button>
        </header>

        <main id="main-ui" class="w-full hidden">
            <div class="bg-white rounded-[2.5rem] p-8 text-center shadow-xl mb-8 border-b-8 border-orange-500/5">
                <p id="user-greeting" class="text-[10px] font-black text-neutral-400 mb-2 tracking-widest uppercase"></p>
                <h2 id="status-title" class="italic-black text-2xl mb-8 leading-none"></h2>
                <div id="stamps-grid" class="grid grid-cols-5 gap-3 mb-8"></div>
                <div id="action-btn-container" class="w-full"></div>
            </div>

            <div id="rewards-section" class="w-full mb-10">
                <h3 class="text-[10px] font-black text-neutral-400 mb-3 px-2 tracking-widest uppercase">Tus Recompensas</h3>
                <div id="rewards-carousel" class="flex overflow-x-auto pb-6 snap-x scrollbar-hide"></div>
            </div>
        </main>
    </div>

    <div id="reglas-modal" class="fixed inset-0 z-[300] modal-blur flex items-center justify-center p-6 hidden">
        <div class="glass-card w-full max-w-sm p-8 shadow-2xl border-2 border-white/50">
            <h3 class="italic-black text-xl mb-4 text-center">Reglas del Club</h3>
            <div id="reglas-content" class="text-sm text-neutral-600 leading-relaxed max-h-[300px] overflow-y-auto mb-6 pr-2 font-medium"></div>
            <button onclick="cerrarReglas()" class="w-full py-4 bg-black text-white rounded-2xl italic-black text-sm">ENTENDIDO</button>
        </div>
    </div>

    <div id="popup-modal" class="fixed inset-0 z-[400] modal-blur flex items-center justify-center p-6 hidden">
        <div class="glass-card w-full max-w-sm p-8 text-center border-4 border-orange-500 relative overflow-hidden">
            <div class="absolute top-0 right-0 p-4"><i data-lucide="sparkles" class="text-orange-500"></i></div>
            <h3 class="italic-black text-2xl mb-4 text-orange-600">¡AVISO IMPORTANTE!</h3>
            <p id="popup-text" class="text-lg font-bold text-neutral-700 mb-8 leading-snug"></p>
            <button onclick="cerrarPopup()" class="w-full py-5 bg-orange-600 text-white rounded-[1.8rem] italic-black shadow-lg">¡GENIAL!</button>
        </div>
    </div>

    <div id="register-modal" class="fixed inset-0 z-[100] bg-white flex items-center justify-center p-6 hidden">
        <div class="w-full max-w-sm text-center">
            <div class="flex justify-center mb-6 text-orange-500"><i data-lucide="pizza" class="w-16 h-16"></i></div>
            <h2 class="italic-black text-3xl mb-2">Bienvenido</h2>
            <p class="text-xs text-neutral-400 mb-8 font-bold uppercase tracking-widest">Ingresa tus datos para unirte al club</p>
            <input type="text" id="reg-name" placeholder="Tu Nombre" class="w-full p-5 mb-3 bg-neutral-100 rounded-3xl font-bold text-center outline-none border-2 border-transparent focus:border-orange-500">
            <input type="email" id="reg-email" placeholder="Tu Correo" class="w-full p-5 mb-3 bg-neutral-100 rounded-3xl font-bold text-center outline-none border-2 border-transparent focus:border-orange-500">
            <input type="tel" id="reg-whatsapp" placeholder="WhatsApp" class="w-full p-5 mb-8 bg-neutral-100 rounded-3xl font-bold text-center outline-none">
            <button id="btn-register" class="w-full py-5 bg-black text-white rounded-[2rem] italic-black text-lg">EMPEZAR AHORA</button>
        </div>
    </div>

    <div id="scanner-modal" class="fixed inset-0 bg-black z-[500] flex flex-col items-center justify-center hidden">
        <div id="reader" class="w-full max-w-md"></div>
        <button onclick="document.getElementById('scanner-modal').classList.add('hidden')" class="mt-8 text-white font-black uppercase text-xs">Cancelar</button>
    </div>
</body>
</html>
