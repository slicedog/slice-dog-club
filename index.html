<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Slice Dog Club | Oficial</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        :root { --sd-mustard: #eb9a1f; --sd-dark: #4a2311; --sd-bg: #f3e5d0; }
        body { font-family: 'Inter', sans-serif; background-color: var(--sd-bg); color: var(--sd-dark); margin: 0; display: flex; justify-content: center; }
        .italic-black { font-weight: 900; font-style: italic; text-transform: uppercase; }
        .app-shell { width: 100%; max-width: 450px; min-height: 100vh; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .main-card { background: white; border-radius: 2.5rem; padding: 2rem; width: 100%; shadow-lg; text-align: center; }
        .stamp-slot { aspect-ratio: 1/1; border-radius: 1rem; display: flex; align-items: center; justify-content: center; border: 2px dashed #e5e5e5; background: #fafafa; }
        .stamp-active { background: var(--sd-mustard); border: none; color: white; }
        #loader { position: fixed; inset: 0; background: var(--sd-bg); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .coupon-card { min-width: 200px; background: white; border: 2px dashed var(--sd-mustard); border-radius: 1.5rem; padding: 1rem; margin-right: 12px; }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // CONFIGURACIÓN DE TU FIREBASE
        const firebaseConfig = {
            apiKey: "AIzaSyAFwDQVPy4xRjw4rxcKcZEwNx1suV7eWW8",
            authDomain: "slice-dog-test-firebase.firebaseapp.com",
            projectId: "slice-dog-test-firebase",
            storageBucket: "slice-dog-test-firebase.firebasestorage.app",
            messagingSenderId: "1024055139023",
            appId: "1:1024055139023:web:42985e24651b5a5f38f5ba"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let userEmail = JSON.parse(localStorage.getItem("sd_user_email"));

        // Función para renderizar (Lo que ves en pantalla)
        function renderApp(data) {
            document.getElementById('loader').classList.add('hidden');
            document.getElementById('register-modal').classList.add('hidden');
            document.getElementById('main-ui').classList.remove('hidden');
            
            document.getElementById('user-name').innerText = `HOLA, ${data.name || 'PIZZERO'} 🍕`;
            const stamps = data.stamps || 0;
            document.getElementById('status-text').innerText = stamps >= 10 ? "¡PREMIO LISTO!" : `FALTAN ${10 - stamps} PARA PREMIO`;

            // Dibujar Sellos
            const grid = document.getElementById('stamps-grid');
            grid.innerHTML = '';
            for(let i=0; i<10; i++) {
                const slot = document.createElement('div');
                slot.className = `stamp-slot ${i < stamps ? 'stamp-active' : ''}`;
                slot.innerHTML = i < stamps ? '<i data-lucide="pizza"></i>' : (i === 9 ? '<i data-lucide="gift" class="text-neutral-300"></i>' : '');
                grid.appendChild(slot);
            }
            lucide.createIcons();
        }

        // Registro de nuevo usuario
        window.registerUser = async () => {
            const name = document.getElementById('reg-name').value;
            const email = document.getElementById('reg-email').value.toLowerCase().trim();
            if(!name || !email) return alert("Completa tus datos");

            const userRef = doc(db, "users", email);
            await setDoc(userRef, { name, email, stamps: 1, cupon_bienvenida: "LISTO", lastUpdate: new Date() });
            localStorage.setItem("sd_user_email", JSON.stringify(email));
            location.reload();
        };

        // INICIO LÓGICO
        window.onload = async () => {
            if(userEmail) {
                const userRef = doc(db, "users", userEmail);
                onSnapshot(userRef, (snapshot) => {
                    if(snapshot.exists()) {
                        renderApp(snapshot.data());
                    } else {
                        // Si el correo en el celular no existe en Firebase, borramos y pedimos registro
                        localStorage.removeItem("sd_user_email");
                        location.reload();
                    }
                }, (error) => {
                    console.error("Error Firebase:", error);
                    alert("Error de conexión con la base de datos.");
                });
            } else {
                document.getElementById('loader').classList.add('hidden');
                document.getElementById('register-modal').classList.remove('hidden');
            }
        };
    </script>
</head>
<body>

    <div id="loader">
        <h2 class="italic-black text-2xl animate-bounce text-orange-600">SLICE DOG</h2>
        <p class="text-[10px] font-bold mt-4">CARGANDO TU CLUB...</p>
    </div>

    <div class="app-shell">
        <header class="py-8">
            <h1 class="italic-black text-2xl">SLICE DOG <span class="text-orange-600">CLUB</span></h1>
        </header>

        <main id="main-ui" class="w-full hidden">
            <div class="main-card shadow-2xl">
                <p id="user-name" class="text-[10px] font-black text-neutral-400 mb-2 tracking-widest uppercase"></p>
                <h2 id="status-text" class="italic-black text-2xl mb-8">CARGANDO...</h2>
                
                <div id="stamps-grid" class="grid grid-cols-5 gap-3 mb-10">
                    </div>

                <button class="w-full py-5 bg-[var(--sd-mustard)] text-white rounded-3xl italic-black shadow-lg">
                    SOLICITAR SELLO
                </button>
            </div>
        </main>
    </div>

    <div id="register-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-[100] flex items-center justify-center p-6 hidden">
        <div class="bg-white w-full rounded-[2.5rem] p-8 text-center shadow-2xl">
            <h2 class="italic-black text-2xl mb-2">¡BIENVENIDO!</h2>
            <p class="text-[10px] text-neutral-400 mb-6 font-bold uppercase">Regístrate para empezar a ganar</p>
            <input type="text" id="reg-name" placeholder="Tu Nombre" class="w-full p-4 mb-3 bg-neutral-100 rounded-2xl font-bold text-center outline-none border-2 border-transparent focus:border-orange-400">
            <input type="email" id="reg-email" placeholder="Tu Correo" class="w-full p-4 mb-6 bg-neutral-100 rounded-2xl font-bold text-center outline-none border-2 border-transparent focus:border-orange-400">
            <button onclick="registerUser()" class="w-full py-5 bg-black text-white rounded-3xl italic-black">UNIRME AL CLUB</button>
        </div>
    </div>

</body>
</html>
