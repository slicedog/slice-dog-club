<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slice Dog | Club de Fidelidad</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        :root { --sd-mustard: #e9a124; --sd-dark: #4a2311; --sd-bg: #f3e5d0; }
        body { font-family: 'Inter', sans-serif; background-color: var(--sd-bg); color: var(--sd-dark); margin: 0; }
        .stamp-card { background: #ffffff; border-radius: 2.5rem; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.1); }
        .stamp-active { background: linear-gradient(135deg, var(--sd-mustard) 0%, #d48a1a 100%); color: white !important; border: none !important; }
        .italic-black { font-weight: 900; font-style: italic; text-transform: uppercase; }
        .sd-input { width: 100%; padding: 1.25rem; background-color: #f9f9f9; border: 2px solid transparent; border-radius: 1.2rem; font-weight: 700; text-align: center; outline: none; margin-bottom: 0.75rem; }
        .sd-input:focus { border-color: var(--sd-mustard); background-color: white; }
        #reader { width: 100% !important; border: none !important; border-radius: 2rem; overflow: hidden; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4">

    <header class="w-full max-w-md text-center py-10">
        <h1 class="italic-black text-2xl tracking-tight">Slice Dog Club</h1>
        <p class="text-[10px] font-bold tracking-[0.3em] uppercase opacity-70">Loyalty Experience</p>
    </header>

    <main id="main-ui" class="w-full max-w-md stamp-card overflow-hidden hidden">
        <div class="p-8 text-center">
            <p id="user-greeting" class="text-[10px] font-black uppercase text-neutral-400 mb-1"></p>
            <h2 id="status-title" class="italic-black text-2xl mb-8 leading-none"></h2>
            <div id="stamps-grid" class="grid grid-cols-5 gap-3 mb-10"></div>
            <button id="btn-scan" onclick="openScanner()" class="w-full py-5 bg-[var(--sd-mustard)] text-white rounded-[1.8rem] italic-black flex items-center justify-center gap-3 shadow-lg">
                <i data-lucide="qr-code"></i> ¡Sellar Compra!
            </button>
            <button id="btn-reward" onclick="redeemReward()" class="hidden w-full py-5 bg-red-700 text-white rounded-[1.8rem] italic-black">Canjear Premio</button>
        </div>
    </main>

    <div id="register-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-[100] flex items-center justify-center p-6 hidden">
        <div class="bg-white w-full max-w-sm rounded-[3rem] p-8 text-center">
            <h2 class="italic-black text-2xl mb-6">Únete al Club</h2>
            <input type="text" id="reg-name" placeholder="Tu Nombre" class="sd-input">
            <input type="email" id="reg-email" placeholder="Correo Electrónico" class="sd-input">
            <input type="tel" id="reg-whatsapp" placeholder="WhatsApp" class="sd-input">
            <button id="btn-register" onclick="registerUser()" class="w-full py-5 bg-black text-white rounded-[1.8rem] italic-black">Empezar Ahora</button>
        </div>
    </div>

    <div id="scanner-modal" class="fixed inset-0 bg-black/95 z-[200] flex flex-col items-center justify-center p-6 hidden">
        <div class="w-full max-w-sm bg-white rounded-[3rem] p-4 relative">
            <div id="reader"></div>
            <button onclick="closeScanner()" class="mt-4 w-full py-2 text-xs font-bold uppercase opacity-50">Cerrar</button>
        </div>
    </div>

    <script>
        const CONFIG = {
            maxStamps: 10,
            storageKey: "slice_dog_v7_final",
            qrPrefix: "SD-",
            scriptURL: "https://script.google.com/macros/s/AKfycbxhaCU_k21Dizx-KURzedFFJIecQoA-oYaHzDdFzUdEHrrB7ylpTac2twghvOufy9vG/exec"
        };

        let user = JSON.parse(localStorage.getItem(CONFIG.storageKey));
        let html5QrCode;

        async function registerUser() {
            const name = document.getElementById('reg-name').value.trim();
            const email = document.getElementById('reg-email').value.trim();
            const whatsapp = document.getElementById('reg-whatsapp').value.trim();

            if(!name || !email || !whatsapp) return alert("Completa todos los datos");

            const btn = document.getElementById('btn-register');
            btn.innerText = "Verificando...";
            btn.disabled = true;

            try {
                // 1. Verificar Duplicados en Google Sheets
                const checkUrl = `${CONFIG.scriptURL}?checkEmail=${encodeURIComponent(email)}&checkPhone=${encodeURIComponent(whatsapp)}`;
                const response = await fetch(checkUrl);
                const checkResult = await response.json();

                if (checkResult.exists) {
                    alert("Este correo o WhatsApp ya están registrados en el Club.");
                    btn.innerText = "Empezar Ahora";
                    btn.disabled = false;
                    return;
                }

                // 2. Si no existe, registrar con 1 SELLO DE REGALO
                await fetch(CONFIG.scriptURL, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: JSON.stringify({
                        nombre: name,
                        email: email,
                        whatsapp: whatsapp,
                        sellos: 1, // <--- Regalo de bienvenida
                        accion: "REGISTRO_NUEVO"
                    })
                });

                user = { name, email, whatsapp, stamps: 1 };
                localStorage.setItem(CONFIG.storageKey, JSON.stringify(user));
                location.reload();
            } catch(e) { 
                alert("Error de conexión. Inténtalo de nuevo."); 
                btn.innerText = "Empezar Ahora";
                btn.disabled = false;
            }
        }

        async function syncStamp(action) {
            fetch(CONFIG.scriptURL, {
                method: 'POST',
                mode: 'no-cors',
                body: JSON.stringify({
                    nombre: user.name,
                    email: user.email,
                    whatsapp: user.whatsapp,
                    sellos: user.stamps,
                    accion: action
                })
            });
        }

        function renderApp() {
            document.getElementById('main-ui').classList.remove('hidden');
            document.getElementById('user-greeting').innerText = `HOLA, ${user.name} 🍕`;
            const grid = document.getElementById('stamps-grid');
            grid.innerHTML = '';
            for (let i = 0; i < CONFIG.maxStamps; i++) {
                const active = i < user.stamps;
                grid.innerHTML += `<div class="aspect-square rounded-2xl flex items-center justify-center border-2 ${active ? 'stamp-active' : 'border-dashed border-neutral-200 bg-neutral-50'}">
                    ${active ? '<i data-lucide="pizza"></i>' : ''}
                </div>`;
            }
            const title = document.getElementById('status-title');
            if(user.stamps >= 10) {
                title.innerHTML = "¡LISTO! <span class='text-[var(--sd-mustard)]'>PIZZA GRATIS</span>";
                document.getElementById('btn-scan').classList.add('hidden');
                document.getElementById('btn-reward').classList.remove('hidden');
            } else {
                title.innerText = `FALTAN ${10 - user.stamps} PARA PREMIO`;
            }
            lucide.createIcons();
        }

        function openScanner() {
            document.getElementById('scanner-modal').classList.remove('hidden');
            html5QrCode = new Html5Qrcode("reader");
            const today = new Date();
            const validCode = `${CONFIG.qrPrefix}${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;

            html5QrCode.start({ facingMode: "environment" }, { fps: 20, qrbox: 250 }, (text) => {
                if(text === validCode) {
                    html5QrCode.stop().then(() => {
                        document.getElementById('scanner-modal').classList.add('hidden');
                        user.stamps++;
                        localStorage.setItem(CONFIG.storageKey, JSON.stringify(user));
                        syncStamp("NUEVO_SELLO");
                        renderApp();
                    });
                }
            }).catch(() => alert("Error de cámara"));
        }

        function closeScanner() { if(html5QrCode) html5QrCode.stop(); document.getElementById('scanner-modal').classList.add('hidden'); }

        window.onload = () => { if(!user) document.getElementById('register-modal').classList.remove('hidden'); else renderApp(); lucide.createIcons(); };
    </script>
</body>
</html>
