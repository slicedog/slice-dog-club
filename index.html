<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Slice Dog Club</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        :root { --sd-mustard: #eb9a1f; --sd-dark: #4a2311; --sd-bg: #f3e5d0; }
        body { font-family: 'Inter', sans-serif; background-color: var(--sd-bg); color: var(--sd-dark); margin: 0; }
        .italic-black { font-weight: 900; font-style: italic; text-transform: uppercase; }
        .stamp-active { background: #eb9a1f; color: white; border: none; }
    </style>
</head>
<body>

    <div id="main-ui" class="max-w-md mx-auto p-6 min-h-screen flex flex-col items-center">
        <header class="py-8">
            <h1 class="italic-black text-2xl tracking-tighter">SLICE DOG <span class="text-orange-600">CLUB</span></h1>
        </header>

        <div class="bg-white rounded-[3rem] p-8 text-center shadow-xl w-full">
            <p id="user-greeting" class="text-[10px] font-black text-neutral-400 mb-1 uppercase tracking-widest"></p>
            <h2 id="status-title" class="italic-black text-xl mb-6">Cargando...</h2>
            
            <div id="stamps-grid" class="grid grid-cols-5 gap-2 mb-6">
                </div>

            <div id="btn-container">
                </div>
        </div>
    </div>

    <div id="register-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-[100] flex items-center justify-center p-6 hidden">
        <div class="bg-white w-full rounded-[3rem] p-8 text-center">
            <h2 class="italic-black text-2xl mb-4">¡Bienvenido!</h2>
            <input type="email" id="reg-email" placeholder="Tu correo electrónico" class="w-full p-4 mb-4 bg-neutral-100 rounded-2xl font-bold text-center border-none outline-none">
            <button id="btn-register" class="w-full py-5 bg-black text-white rounded-2xl italic-black">Entrar</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAFwDQVPy4xRjw4rxcKcZEwNx1suV7eWW8",
            authDomain: "slice-dog-test-firebase.firebaseapp.com",
            projectId: "slice-dog-test-firebase",
            storageBucket: "slice-dog-test-firebase.firebasestorage.app",
            messagingSenderId: "1024055139023",
            appId: "1:1024055139023:web:42985e24651b5a5f38f5ba"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        let userEmail = JSON.parse(localStorage.getItem("sd_user_email"));

        // Función para renderizar el tablero original
        function renderApp(data) {
            const stamps = data.stamps || 0;
            document.getElementById('user-greeting').innerText = `Hola, ${data.name || 'Cliente'} 🍕`;
            document.getElementById('status-title').innerText = stamps >= 10 ? "¡PREMIO LISTO!" : `FALTAN ${10 - stamps} PARA PREMIO`;
            
            const grid = document.getElementById('stamps-grid');
            grid.innerHTML = '';
            for(let i=0; i<10; i++) {
                const active = i < stamps;
                grid.innerHTML += `
                    <div class="aspect-square rounded-xl flex items-center justify-center border-2 ${active ? 'stamp-active' : 'border-dashed border-neutral-200'}">
                        ${active ? '<i data-lucide="pizza" class="w-4 h-4"></i>' : (i===9 ? '<i data-lucide="gift" class="text-neutral-200 w-4 h-4"></i>' : '')}
                    </div>`;
            }

            const btnContainer = document.getElementById('btn-container');
            btnContainer.innerHTML = `
                <button class="w-full py-5 bg-[#eb9a1f] text-white rounded-2xl italic-black shadow-lg flex items-center justify-center gap-2">
                    <i data-lucide="qr-code"></i> Solicitar Sello
                </button>`;
            
            lucide.createIcons();
        }

        window.onload = () => {
            if(userEmail) {
                onSnapshot(doc(db, "users", userEmail), (snapshot) => {
                    if(snapshot.exists()) renderApp(snapshot.data());
                });
            } else {
                document.getElementById('register-modal').classList.remove('hidden');
            }

            // CORRECCIÓN: Usamos addEventListener para evitar el error de "null"
            const regBtn = document.getElementById('btn-register');
            if(regBtn) {
                regBtn.addEventListener('click', async () => {
                    const email = document.getElementById('reg-email').value.toLowerCase().trim();
                    if(email) {
                        localStorage.setItem("sd_user_email", JSON.stringify(email));
                        location.reload();
                    }
                });
            }
        };
    </script>
</body>
</html>
