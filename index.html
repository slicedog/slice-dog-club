<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title id="page-title">Cargando...</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        :root { --sd-mustard: #eb9a1f; --sd-dark: #4a2311; --sd-bg: #f3e5d0; }
        body { font-family: 'Inter', sans-serif; background-color: var(--sd-bg); color: var(--sd-dark); margin: 0; padding: 0; width: 100%; overflow-x: hidden; }
        .italic-black { font-weight: 900; font-style: italic; text-transform: uppercase; }
        #loader { position: fixed; inset: 0; background: var(--sd-bg); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; transition: opacity 0.5s; }
        .app-container { width: 100%; max-width: 450px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 0 20px; }
        .stamp-active { background: linear-gradient(135deg, var(--sd-mustard) 0%, #c97e10 100%); color: white; border: none; }
        .modal-blur { backdrop-filter: blur(8px); background: rgba(0,0,0,0.7); }
        .glass-card { background: rgba(255, 255, 255, 0.95); border-radius: 2.5rem; }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, onSnapshot, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAFwDQVPy4xRjw4rxcKcZEwNx1suV7eWW8",
            authDomain: "slice-dog-test-firebase.firebaseapp.com",
            projectId: "slice-dog-test-firebase",
            storageBucket: "slice-dog-test-firebase.firebasestorage.app",
            messagingSenderId: "1024055139023",
            appId: "1:1024055139023:web:42985e24651b5a5f38f5ba"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        const urlParams = new URLSearchParams(window.location.search);
        const COMERCIO_ID = urlParams.get('id') || 'slicedog'; 
        const SECRET_SALT = "SD2026"; 
        const BLOQUE_TIEMPO_MS = 180000; 
        const COOLDOWN_MINUTOS = 10; // Tiempo de espera entre sellos

        let userStoredEmail = JSON.parse(localStorage.getItem(`sd_user_${COMERCIO_ID}`));
        let globalConfig = {};
        let popupMostrado = false;

        const hideLoader = () => {
            const l = document.getElementById('loader');
            if(l) { l.style.opacity = '0'; setTimeout(() => l.remove(), 500); }
        };

        // 1. ESCUCHAR CONFIGURACIÓN (NOMBRE, REGLAS, POPUPS)
        onSnapshot(doc(db, "config", "promos"), (snapshot) => {
            if(snapshot.exists()) {
                globalConfig = snapshot.data();
                document.getElementById('page-title').innerText = globalConfig.nombre_comercio || 'Club';
                document.getElementById('brand-name').innerHTML = `${globalConfig.nombre_comercio || 'Club'} <span class="text-orange-600">Club</span>`;
                document.getElementById('reglas-content').innerText = globalConfig.reglas_club || "Sin reglas definidas.";
                
                if(globalConfig.popup_activo && !popupMostrado) {
                    mostrarPopup(globalConfig.popup_texto);
                    popupMostrado = true;
                }
            }
        });

        // 2. ESCUCHAR USUARIO (EN TIEMPO REAL - SOLUCIONA EL REFRESH)
        if (userStoredEmail) {
            onSnapshot(doc(db, "users", userStoredEmail), (snapshot) => {
                if (snapshot.exists() && snapshot.data().comercio_id === COMERCIO_ID) {
                    renderApp(snapshot.data());
                    hideLoader();
                } else {
                    localStorage.removeItem(`sd_user_${COMERCIO_ID}`);
                    location.reload();
                }
            });
        } else {
            setTimeout(() => {
                hideLoader();
                document.getElementById('register-modal').classList.remove('hidden');
            }, 1000);
        }

        function renderApp(data) {
            document.getElementById('register-modal').classList.add('hidden');
            document.getElementById('main-ui').classList.remove('hidden');
            document.getElementById('user-greeting').innerText = `HOLA, ${data.name} 🍕`;
            
            const statusEl = document.getElementById('status-title');
            const btnContainer = document.getElementById('action-btn-container');
            const currentStamps = data.stamps || 0;

            // Lógica de visualización de PIN
            if (data.active_pin) {
                statusEl.innerText = "MUESTRA EL PIN AL CAJERO";
                btnContainer.innerHTML = `<div class="w-full py-5 bg-orange-600 text-white rounded-[1.8rem] italic-black flex flex-col items-center justify-center animate-pulse"><span class="text-4xl tracking-[0.3em]">${data.active_pin}</span><span class="text-[10px] mt-1 opacity-80">PIN DE CANJE ACTIVO</span></div>`;
            } else {
                if (currentStamps >= 10) {
                    statusEl.innerText = "¡TIENES UN PREMIO!";
                    btnContainer.innerHTML = `<button onclick="window.useCoupon('${data.email}', 'TABLERO', '${data.name}')" class="w-full py-5 bg-orange-600 text-white rounded-[1.8rem] italic-black shadow-lg">RECLAMAR RECOMPENSA</button>`;
                } else {
                    statusEl.innerText = `FALTAN ${10 - currentStamps} PARA TU PREMIO`;
                    btnContainer.innerHTML = `<button id="btn-scan" onclick="window.validarYAbrirScanner('${data.email}', ${currentStamps})" class="w-full py-5 bg-[var(--sd-mustard)] text-white rounded-[1.8rem] italic-black flex items-center justify-center gap-3 shadow-lg"><i data-lucide="qr-code"></i> Solicitar Sello</button>`;
                }
            }

            // Grid de Sellos
            const grid = document.getElementById('stamps-grid'); grid.innerHTML = '';
            for(let i=0; i<10; i++) {
                const active = i < currentStamps;
                const slot = document.createElement('div');
                slot.className = `aspect-square rounded-2xl flex items-center justify-center border-2 ${active ? 'stamp-active' : 'border-dashed border-neutral-300 bg-neutral-50/50'}`;
                slot.innerHTML = active ? (i === 9 ? '<i data-lucide="gift"></i>' : '<i data-lucide="pizza"></i>') : '';
                grid.appendChild(slot);
            }
            lucide.createIcons();
        }

        // --- SEGURIDAD: CONTROL DE TIEMPO (COOLDOWN) ---
        window.validarYAbrirScanner = (email, currentStamps) => {
            const lastStamp = localStorage.getItem(`sd_last_stamp_${COMERCIO_ID}`);
            const ahora = Date.now();
            
            if (lastStamp) {
                const diffMinutos = (ahora - parseInt(lastStamp)) / 60000;
                if (diffMinutos < COOLDOWN_MINUTOS) {
                    const faltan = Math.ceil(COOLDOWN_MINUTOS - diffMinutos);
                    alert(`⛔ ¡Paciencia! Podrás sumar otro sello en ${faltan} minutos.`);
                    return;
                }
            }
            window.openScanner(email, currentStamps);
        };

        window.openScanner = (email, currentStamps) => {
            document.getElementById('scanner-modal').classList.remove('hidden');
            let scanner = new Html5Qrcode("reader");
            scanner.start({ facingMode: "environment" }, { fps: 15, qrbox: 250 }, async (text) => {
                const b1 = Math.floor(Date.now() / BLOQUE_TIEMPO_MS);
                if (text.trim() === btoa(b1 + "_" + SECRET_SALT) || text.trim() === btoa((b1-1) + "_" + SECRET_SALT)) {
                    await scanner.stop();
                    document.getElementById('scanner-modal').classList.add('hidden');
                    // Actualizar Firebase
                    await updateDoc(doc(db, "users", email), { stamps: currentStamps + 1 });
                    // Guardar marca de tiempo local
                    localStorage.setItem(`sd_last_stamp_${COMERCIO_ID}`, Date.now());
                    alert("✅ ¡Sello añadido con éxito!");
                } else {
                    alert("❌ QR INVÁLIDO O EXPIRADO");
                }
            }).catch(err => alert("Error de cámara: " + err));
        };

        window.useCoupon = async (email, type, name) => {
            if(!confirm("¿Quieres canjear tu premio ahora? Muestra el código al cajero.")) return;
            const pin = Math.floor(100 + Math.random() * 900);
            const updateData = { active_pin: pin, pin_type: type, pin_timestamp: Date.now() };
            if(type === 'TABLERO') updateData.stamps = 0;
            await updateDoc(doc(db, "users", email), updateData);
            await addDoc(collection(db, "historial"), { email, nombre: name, tipo: type, pin, fecha: new Date(), comercio_id: COMERCIO_ID });
        };

        window.mostrarPopup = (msg) => {
            document.getElementById('popup-text').innerText = msg;
            document.getElementById('popup-modal').classList.remove('hidden');
        };
        window.cerrarPopup = () => document.getElementById('popup-modal').classList.add('hidden');
        window.abrirReglas = () => document.getElementById('reglas-modal').classList.remove('hidden');
        window.cerrarReglas = () => document.getElementById('reglas-modal').classList.add('hidden');

        window.registerUser = async () => {
            const n = document.getElementById('reg-name').value, e = document.getElementById('reg-email').value.toLowerCase().trim();
            if(!e || !n) return alert("Completa tus datos");
            await setDoc(doc(db, "users", e), { name: n, email: e, stamps: 0, comercio_id: COMERCIO_ID });
            localStorage.setItem(`sd_user_${COMERCIO_ID}`, JSON.stringify(e));
            location.reload();
        };

    </script>
</head>
<body>
    <div id="loader">
        <div class="animate-bounce mb-4 text-orange-500"><i data-lucide="pizza" class="w-12 h-12"></i></div>
        <h2 class="italic-black text-xl">SLICE DOG CLUB</h2>
    </div>

    <div class="app-container">
        <header class="w-full text-center py-8">
            <h1 id="brand-name" class="italic-black text-2xl italic tracking-tighter">Cargando...</h1>
            <button onclick="abrirReglas()" class="text-[9px] font-black text-orange-600/50 uppercase tracking-widest mt-1">Ver reglas del club</button>
        </header>

        <main id="main-ui" class="w-full hidden">
            <div class="bg-white rounded-[2.5rem] p-8 text-center shadow-xl mb-8 border-b-8 border-orange-500/5">
                <p id="user-greeting" class="text-[10px] font-black text-neutral-400 mb-2 tracking-widest uppercase"></p>
                <h2 id="status-title" class="italic-black text-xl mb-8 leading-none"></h2>
                <div id="stamps-grid" class="grid grid-cols-5 gap-3 mb-8"></div>
                <div id="action-btn-container" class="w-full"></div>
            </div>
        </main>
    </div>

    <div id="reglas-modal" class="fixed inset-0 z-[300] modal-blur flex items-center justify-center p-6 hidden">
        <div class="glass-card w-full max-w-sm p-8 shadow-2xl border-2 border-white/50">
            <h3 class="italic-black text-xl mb-4 text-center">Reglas del Club</h3>
            <div id="reglas-content" class="text-sm text-neutral-600 leading-relaxed max-h-[300px] overflow-y-auto mb-6 pr-2"></div>
            <button onclick="cerrarReglas()" class="w-full py-4 bg-black text-white rounded-2xl italic-black text-sm">ENTENDIDO</button>
        </div>
    </div>

    <div id="popup-modal" class="fixed inset-0 z-[400] modal-blur flex items-center justify-center p-6 hidden">
        <div class="glass-card w-full max-w-sm p-8 text-center border-4 border-orange-500">
            <h3 class="italic-black text-2xl mb-4 text-orange-600">¡AVISO!</h3>
            <p id="popup-text" class="text-lg font-bold text-neutral-700 mb-8 leading-snug"></p>
            <button onclick="cerrarPopup()" class="w-full py-5 bg-orange-600 text-white rounded-[1.8rem] italic-black">¡GENIAL!</button>
        </div>
    </div>

    <div id="register-modal" class="fixed inset-0 z-[100] bg-white flex items-center justify-center p-6 hidden">
        <div class="w-full max-w-sm text-center">
            <h2 class="italic-black text-3xl mb-8">Bienvenido</h2>
            <input type="text" id="reg-name" placeholder="Tu Nombre" class="w-full p-5 mb-3 bg-neutral-100 rounded-3xl font-bold text-center outline-none">
            <input type="email" id="reg-email" placeholder="Tu Correo" class="w-full p-5 mb-8 bg-neutral-100 rounded-3xl font-bold text-center outline-none">
            <button onclick="registerUser()" class="w-full py-5 bg-black text-white rounded-[2rem] italic-black text-lg">EMPEZAR</button>
        </div>
    </div>

    <div id="scanner-modal" class="fixed inset-0 bg-black z-[500] flex flex-col items-center justify-center hidden">
        <div id="reader" class="w-full max-w-md"></div>
        <button onclick="document.getElementById('scanner-modal').classList.add('hidden')" class="mt-8 text-white font-black uppercase text-xs">Cancelar</button>
    </div>
</body>
</html>
