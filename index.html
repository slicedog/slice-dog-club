<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Slice Dog Club | Fidelización</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --terracotta: #A64B2A;
            --dark-dog: #1a1a1a;
            --crust: #E8C07D;
        }
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--dark-dog); 
            color: white;
            -webkit-tap-highlight-color: transparent;
        }
        .font-brand { font-family: 'Bangers', cursive; }
        .stamp-slot { 
            aspect-ratio: 1/1; 
            background: rgba(255,255,255,0.03); 
            border: 2px dashed rgba(232, 192, 125, 0.2);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .stamp-active {
            background: var(--terracotta);
            border: 2px solid var(--crust);
            transform: scale(1.05) rotate(-3deg);
            box-shadow: 0 0 15px rgba(166, 75, 42, 0.5);
        }
        .loading-overlay {
            background: rgba(0, 0, 0, 0.9);
            display: none;
            backdrop-filter: blur(10px);
        }
        input::placeholder { color: #4b5563; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4">

    <!-- Header -->
    <header class="w-full max-w-md text-center my-8">
        <h1 class="text-6xl font-brand text-orange-500 tracking-wider drop-shadow-xl">SLICE DOG CLUB</h1>
        <p class="text-xs uppercase tracking-[0.3em] text-zinc-500 mt-2 font-bold">The Pizza Loyalty Society</p>
    </header>

    <main id="app" class="w-full max-w-md">
        
        <!-- Vista 1: Registro -->
        <section id="view-register" class="bg-zinc-900/50 p-8 rounded-[2rem] border border-zinc-800 shadow-2xl backdrop-blur-md">
            <h2 class="text-2xl font-bold mb-2">Bienvenido al Club 🍕</h2>
            <p class="text-zinc-400 mb-8 text-sm leading-relaxed text-balance">Regístrate y recibe tu primer sello de cortesía inmediatamente.</p>
            
            <div class="space-y-5">
                <div>
                    <label class="text-[10px] uppercase font-black text-zinc-500 tracking-widest ml-1">Nombre y Apellido</label>
                    <input type="text" id="reg-name" class="w-full bg-zinc-800/50 border border-zinc-700 p-4 rounded-2xl mt-1 focus:ring-2 ring-orange-500 outline-none transition-all" placeholder="Ej: Dante Alighieri">
                </div>
                <div>
                    <label class="text-[10px] uppercase font-black text-zinc-500 tracking-widest ml-1">WhatsApp</label>
                    <input type="tel" id="reg-phone" class="w-full bg-zinc-800/50 border border-zinc-700 p-4 rounded-2xl mt-1 focus:ring-2 ring-orange-500 outline-none transition-all" placeholder="+569 1234 5678">
                </div>
                <button onclick="handleRegister()" class="w-full bg-orange-600 hover:bg-orange-500 text-white font-black py-5 rounded-2xl transition-all shadow-lg active:scale-95 text-sm tracking-widest uppercase">
                    OBTENER MI PRIMER SELLO
                </button>
            </div>
        </section>

        <!-- Vista 2: Dashboard -->
        <section id="view-dashboard" class="hidden space-y-6">
            <div class="bg-zinc-900/80 p-6 rounded-[2.5rem] border border-zinc-800 shadow-2xl relative overflow-hidden">
                <div class="flex justify-between items-start mb-8">
                    <div>
                        <p class="text-[10px] text-zinc-500 uppercase font-black tracking-widest">Socio Activo</p>
                        <p id="user-display-name" class="font-bold text-xl text-white">---</p>
                    </div>
                    <div class="bg-orange-500/10 px-4 py-2 rounded-full border border-orange-500/20 text-orange-500 text-[10px] font-black uppercase">Premium</div>
                </div>

                <div class="grid grid-cols-4 gap-4 mb-8" id="stamp-grid"></div>

                <div class="bg-black/40 p-4 rounded-2xl text-center">
                    <p class="text-xs text-zinc-300">Te faltan <span id="stamps-left" class="text-orange-500 font-bold text-sm">8</span> compras para tu premio.</p>
                </div>
            </div>

            <button onclick="openStaffAuth()" class="w-full flex items-center justify-center gap-3 bg-white text-black py-5 rounded-2xl font-black shadow-xl active:scale-95 transition-transform uppercase text-xs tracking-widest">
                <span class="text-xl">🍕</span> VALIDAR CONSUMO
            </button>
        </section>

        <!-- Vista 3: Recompensa -->
        <section id="view-reward" class="hidden bg-orange-600 p-8 rounded-[3rem] text-center shadow-2xl">
            <h2 class="text-5xl font-brand text-white mb-2 uppercase">¡DOG MASTER!</h2>
            <div class="bg-black/20 text-white p-6 rounded-3xl font-black text-3xl mb-8 tracking-widest">SLICE-FREE</div>
            <button onclick="resetCard()" class="text-orange-200 text-[10px] uppercase font-bold tracking-widest">Canjear y Reiniciar</button>
        </section>
    </main>

    <!-- Modal Staff -->
    <div id="staff-auth-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-6 bg-black/95">
        <div class="bg-zinc-900 w-full max-w-xs p-8 rounded-[2.5rem] border border-zinc-800 text-center">
            <h3 class="text-xl font-bold mb-8 uppercase tracking-widest">PIN Staff</h3>
            <input type="password" id="staff-pin" maxlength="4" inputmode="numeric" class="w-full bg-zinc-800 text-center text-4xl p-5 rounded-2xl tracking-[0.5em] outline-none focus:ring-2 ring-orange-500 mb-8" placeholder="****">
            <div class="grid grid-cols-2 gap-4">
                <button onclick="closeStaffAuth()" class="bg-zinc-800 py-4 rounded-xl text-[10px] font-black uppercase tracking-widest">Cerrar</button>
                <button onclick="validateAndAddStamp()" class="bg-orange-600 py-4 rounded-xl text-[10px] font-black uppercase tracking-widest">Confirmar</button>
            </div>
        </div>
    </div>

    <!-- Loader -->
    <div id="loader" class="fixed inset-0 z-[100] loading-overlay flex flex-col items-center justify-center">
        <div class="animate-spin rounded-full h-16 w-16 border-t-2 border-orange-500 mb-4"></div>
        <p class="text-[10px] font-black uppercase tracking-[0.3em] text-orange-500">Sincronizando...</p>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxhaCU_k21Dizx-KURzedFFJIecQoA-oYaHzDdFzUdEHrrB7ylpTac2twghvOufy9vG/exec";
        const TOTAL_STAMPS = 8;
        const STAFF_PIN = "2024";

        let userData = { name: "", phone: "", stamps: 0, registered: false };

        window.onload = () => {
            const saved = localStorage.getItem('sdc_v1_user');
            if (saved) {
                userData = JSON.parse(saved);
                renderApp();
            }
        };

        function renderApp() {
            document.querySelectorAll('section').forEach(s => s.classList.add('hidden'));
            if (!userData.registered) {
                document.getElementById('view-register').classList.remove('hidden');
            } else if (userData.stamps >= TOTAL_STAMPS) {
                document.getElementById('view-reward').classList.remove('hidden');
                triggerConfetti();
            } else {
                document.getElementById('view-dashboard').classList.remove('hidden');
                updateDashboard();
            }
        }

        function updateDashboard() {
            document.getElementById('user-display-name').innerText = userData.name;
            document.getElementById('stamps-left').innerText = Math.max(0, TOTAL_STAMPS - userData.stamps);
            const grid = document.getElementById('stamp-grid');
            grid.innerHTML = '';
            for (let i = 0; i < TOTAL_STAMPS; i++) {
                const slot = document.createElement('div');
                const active = i < userData.stamps;
                slot.className = `stamp-slot rounded-2xl flex items-center justify-center text-3xl ${active ? 'stamp-active' : ''}`;
                slot.innerHTML = active ? '🍕' : '<span class="opacity-10 text-xs">SDC</span>';
                grid.appendChild(slot);
            }
        }

        // FUNCIÓN CLAVE: NO ESPERA AL SERVIDOR PARA ACTUALIZAR LA UI
        function handleRegister() {
            const name = document.getElementById('reg-name').value.trim();
            const phone = document.getElementById('reg-phone').value.trim();

            if (!name || !phone) return alert("Completa los datos.");

            // 1. Guardar y mostrar dashboard de inmediato
            userData = { name, phone, stamps: 1, registered: true };
            localStorage.setItem('sdc_v1_user', JSON.stringify(userData));
            renderApp();

            // 2. Sincronizar en segundo plano sin bloquear al usuario
            fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                body: JSON.stringify({ action: 'register', name, phone, stamps: 1 })
            }).catch(e => console.log("Sync background fail"));
        }

        function validateAndAddStamp() {
            const pin = document.getElementById('staff-pin').value;
            if (pin === STAFF_PIN) {
                // 1. Actualizar UI de inmediato
                userData.stamps++;
                localStorage.setItem('sdc_v1_user', JSON.stringify(userData));
                closeStaffAuth();
                renderApp();

                // 2. Sincronizar en segundo plano
                fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: JSON.stringify({ action: 'addStamp', phone: userData.phone })
                }).catch(e => console.log("Sync background fail"));
            } else {
                alert("PIN INCORRECTO");
                document.getElementById('staff-pin').value = '';
            }
        }

        function openStaffAuth() { document.getElementById('staff-auth-modal').classList.remove('hidden'); document.getElementById('staff-pin').focus(); }
        function closeStaffAuth() { document.getElementById('staff-auth-modal').classList.add('hidden'); document.getElementById('staff-pin').value = ''; }
        function triggerConfetti() { confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } }); }
        function resetCard() { if(confirm("¿Reiniciar tarjeta?")) { userData.stamps = 0; localStorage.setItem('sdc_v1_user', JSON.stringify(userData)); renderApp(); } }
    </script>
</body>
</html>
