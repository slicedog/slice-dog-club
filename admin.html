<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Slice Dog</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
    </style>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, query, where, onSnapshot, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAFwDQVPy4xRjw4rxcKcZEwNx1suV7eWW8",
            authDomain: "slice-dog-test-firebase.firebaseapp.com",
            projectId: "slice-dog-test-firebase",
            storageBucket: "slice-dog-test-firebase.firebasestorage.app",
            messagingSenderId: "1024055139023",
            appId: "1:1024055139023:web:42985e24651b5a5f38f5ba"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const COMERCIO_ID = "slice-dog-001";

        // Métricas
        onSnapshot(query(collection(db, "users"), where("comercio_id", "==", COMERCIO_ID)), (snap) => {
            document.getElementById('count-users').innerText = snap.size;
            let total = 0;
            const table = document.getElementById('table-body');
            table.innerHTML = '';
            snap.forEach(doc => {
                const u = doc.data();
                total += (u.stamps || 0);
                table.innerHTML += `
                    <tr class="border-b text-sm">
                        <td class="p-4 font-bold">${u.name}</td>
                        <td class="p-4">${u.email}</td>
                        <td class="p-4 text-center"><span class="bg-orange-100 text-orange-600 px-3 py-1 rounded-full font-bold">${u.stamps}</span></td>
                    </tr>
                `;
            });
            document.getElementById('count-stamps').innerText = total;
        });

        // Actividad en vivo
        onSnapshot(query(collection(db, "historial"), where("comercio_id", "==", COMERCIO_ID), orderBy("fecha", "desc"), limit(5)), (snap) => {
            const list = document.getElementById('activity-list');
            list.innerHTML = '';
            snap.forEach(doc => {
                const h = doc.data();
                list.innerHTML += `
                    <div class="p-4 bg-white mb-2 rounded-xl shadow-sm border-l-4 border-orange-500">
                        <p class="text-xs font-black uppercase">${h.tipo}</p>
                        <p class="text-sm font-medium">${h.nombre}</p>
                    </div>
                `;
            });
        });

        window.onload = () => lucide.createIcons();
    </script>
</head>
<body class="p-8">
    <div class="max-w-6xl mx-auto">
        <h1 class="text-4xl font-black mb-8 italic">DASHBOARD <span class="text-orange-500">ADMIN</span></h1>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-10">
            <div class="bg-white p-8 rounded-[2rem] shadow-sm">
                <p class="text-slate-400 font-bold text-xs uppercase tracking-widest mb-2">Clientes</p>
                <h3 id="count-users" class="text-5xl font-black text-slate-800">0</h3>
            </div>
            <div class="bg-white p-8 rounded-[2rem] shadow-sm">
                <p class="text-slate-400 font-bold text-xs uppercase tracking-widest mb-2">Sellos Totales</p>
                <h3 id="count-stamps" class="text-5xl font-black text-slate-800">0</h3>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="lg:col-span-2 bg-white rounded-[2rem] overflow-hidden shadow-sm">
                <table class="w-full text-left">
                    <thead class="bg-slate-50">
                        <tr class="text-[10px] font-black uppercase text-slate-400">
                            <th class="p-4">Cliente</th>
                            <th class="p-4">Email</th>
                            <th class="p-4 text-center">Sellos</th>
                        </tr>
                    </thead>
                    <tbody id="table-body"></tbody>
                </table>
            </div>
            <div id="activity-list"></div>
        </div>
    </div>
</body>
</html>
