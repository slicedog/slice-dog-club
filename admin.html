<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Slice Dog Club</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .stat-card { transition: transform 0.2s; }
        .stat-card:hover { transform: translateY(-5px); }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, query, where, onSnapshot, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAFwDQVPy4xRjw4rxcKcZEwNx1suV7eWW8",
            authDomain: "slice-dog-test-firebase.firebaseapp.com",
            projectId: "slice-dog-test-firebase",
            storageBucket: "slice-dog-test-firebase.firebasestorage.app",
            messagingSenderId: "1024055139023",
            appId: "1:1024055139023:web:42985e24651b5a5f38f5ba"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // --- IDENTIDAD SAAS ---
        const COMERCIO_ID = "slice-dog-001";

        // --- CARGAR MÉTRICAS Y TABLA FILTRADA POR COMERCIO ---
        const qUsuarios = query(
            collection(db, "users"), 
            where("comercio_id", "==", COMERCIO_ID) // <--- FILTRO MAESTRO
        );

        onSnapshot(qUsuarios, (snapshot) => {
            const users = [];
            let totalStamps = 0;
            snapshot.forEach(doc => {
                const data = doc.data();
                users.push(data);
                totalStamps += (data.stamps || 0);
            });

            document.getElementById('total-clientes').innerText = users.length;
            document.getElementById('total-sellos').innerText = totalStamps;
            
            const tableBody = document.getElementById('table-users-body');
            tableBody.innerHTML = '';
            users.sort((a, b) => (b.stamps || 0) - (a.stamps || 0)).forEach(user => {
                const row = document.createElement('tr');
                row.className = "border-b hover:bg-gray-50 transition-colors";
                row.innerHTML = `
                    <td class="px-6 py-4 font-semibold text-gray-800">${user.name}</td>
                    <td class="px-6 py-4 text-gray-600">${user.email}</td>
                    <td class="px-6 py-4 text-gray-600">${user.whatsapp || 'N/A'}</td>
                    <td class="px-6 py-4 text-center">
                        <span class="px-3 py-1 bg-orange-100 text-orange-700 rounded-full text-xs font-bold">
                            ${user.stamps || 0} Sellos
                        </span>
                    </td>
                `;
                tableBody.appendChild(row);
            });
        });

        // --- CARGAR HISTORIAL RECIENTE FILTRADO ---
        const historyQuery = query(
            collection(db, "historial"), 
            where("comercio_id", "==", COMERCIO_ID), // <--- FILTRO MAESTRO
            orderBy("fecha", "desc"), 
            limit(10)
        );

        onSnapshot(historyQuery, (snapshot) => {
            const historyList = document.getElementById('history-list');
            historyList.innerHTML = '';
            snapshot.forEach(doc => {
                const data = doc.data();
                const fecha = data.fecha?.toDate().toLocaleString() || 'Reciente';
                const item = document.createElement('div');
                item.className = `flex items-center justify-between p-4 bg-white border-l-4 ${data.tipo === 'TABLERO' ? 'border-green-500' : 'border-blue-500'} rounded-r-xl shadow-sm mb-3`;
                item.innerHTML = `
                    <div>
                        <p class="text-sm font-black text-gray-800 uppercase">${data.tipo}</p>
                        <p class="text-xs text-gray-500">${data.nombre} (${data.email})</p>
                    </div>
                    <div class="text-right">
                        <p class="text-[10px] font-bold text-gray-400 uppercase">${fecha}</p>
                        <p class="text-xs font-bold ${data.estado === 'GENERADO' ? 'text-orange-500' : 'text-green-600'}">${data.estado || 'OK'}</p>
                    </div>
                `;
                historyList.appendChild(item);
            });
        });

        window.onload = () => lucide.createIcons();
    </script>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-7xl mx-auto">
        <header class="flex flex-col md:flex-row md:items-center justify-between mb-10 gap-4">
            <div>
                <h1 class="text-3xl font-black text-slate-900 tracking-tighter">DASHBOARD <span class="text-orange-500">ADMIN</span></h1>
                <p class="text-slate-500 font-medium text-sm">Gestionando Slice Dog Club 🍕</p>
            </div>
            <div class="flex gap-2">
                <button onclick="location.reload()" class="p-3 bg-white border rounded-xl shadow-sm hover:bg-gray-50">
                    <i data-lucide="refresh-cw" class="w-5 h-5 text-slate-600"></i>
                </button>
            </div>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
            <div class="stat-card bg-white p-6 rounded-[2rem] shadow-sm border border-slate-100 flex items-center gap-5">
                <div class="w-14 h-14 bg-blue-100 rounded-2xl flex items-center justify-center text-blue-600">
                    <i data-lucide="users" class="w-7 h-7"></i>
                </div>
                <div>
                    <p class="text-slate-400 text-xs font-bold uppercase tracking-wider">Total Clientes</p>
                    <h3 id="total-clientes" class="text-3xl font-black text-slate-800">0</h3>
                </div>
            </div>

            <div class="stat-card bg-white p-6 rounded-[2rem] shadow-sm border border-slate-100 flex items-center gap-5">
                <div class="w-14 h-14 bg-orange-100 rounded-2xl flex items-center justify-center text-orange-600">
                    <i data-lucide="pizza" class="w-7 h-7"></i>
                </div>
                <div>
                    <p class="text-slate-400 text-xs font-bold uppercase tracking-wider">Sellos Entregados</p>
                    <h3 id="total-sellos" class="text-3xl font-black text-slate-800">0</h3>
                </div>
            </div>

            <div class="stat-card bg-white p-6 rounded-[2rem] shadow-sm border border-slate-100 flex items-center gap-5">
                <div class="w-14 h-14 bg-green-100 rounded-2xl flex items-center justify-center text-green-600">
                    <i data-lucide="gift" class="w-7 h-7"></i>
                </div>
                <div>
                    <p class="text-slate-400 text-xs font-bold uppercase tracking-wider">Premios Canjeados</p>
                    <h3 class="text-3xl font-black text-slate-800">Próximamente</h3>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-10">
            <div class="lg:col-span-2 bg-white rounded-[2rem] shadow-sm border border-slate-100 overflow-hidden">
                <div class="p-6 border-b border-slate-50 flex justify-between items-center">
                    <h3 class="font-black text-slate-800 uppercase tracking-tight">Base de Datos de Clientes</h3>
                    <i data-lucide="download" class="w-5 h-5 text-slate-400 cursor-pointer"></i>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left">
                        <thead class="bg-slate-50 text-slate-400 text-[10px] font-black uppercase">
                            <tr>
                                <th class="px-6 py-4">Nombre</th>
                                <th class="px-6 py-4">Correo</th>
                                <th class="px-6 py-4">WhatsApp</th>
                                <th class="px-6 py-4 text-center">Progreso</th>
                            </tr>
                        </thead>
                        <tbody id="table-users-body" class="text-sm"></tbody>
                    </table>
                </div>
            </div>

            <div class="bg-transparent">
                <h3 class="font-black text-slate-800 uppercase tracking-tight mb-6 flex items-center gap-2">
                    <i data-lucide="activity" class="w-5 h-5 text-orange-500"></i>
                    Actividad en Vivo
                </h3>
                <div id="history-list"></div>
            </div>
        </div>
    </div>
</body>
</html>
