<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍕 Validator | Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, query, where, getDocs, doc, updateDoc, deleteField } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAFwDQVPy4xRjw4rxcKcZEwNx1suV7eWW8",
            authDomain: "slice-dog-test-firebase.firebaseapp.com",
            projectId: "slice-dog-test-firebase",
            storageBucket: "slice-dog-test-firebase.firebasestorage.app",
            messagingSenderId: "1024055139023",
            appId: "1:1024055139023:web:42985e24651b5a5f38f5ba"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.buscarPin = async () => {
            const pinBuscado = parseInt(document.getElementById('search-pin').value);
            const infoDiv = document.getElementById('info-cliente');
            if(!pinBuscado) return;

            infoDiv.innerHTML = `<p class="text-white animate-pulse text-center">Buscando PIN ${pinBuscado}...</p>`;
            const q = query(collection(db, "users"), where("active_pin", "==", pinBuscado));
            const querySnapshot = await getDocs(q);

            if (!querySnapshot.empty) {
                const userDoc = querySnapshot.docs[0];
                const data = userDoc.data();
                const currentStamps = data.stamps || 0;
                const isNinth = (data.pin_type === 'SELLO' && currentStamps === 9);

                infoDiv.innerHTML = `
                    <div class="bg-white p-6 rounded-[2rem] shadow-2xl border-4 ${isNinth ? 'border-orange-500 bg-orange-50' : 'border-green-500'}">
                        ${isNinth ? '<div class="bg-orange-600 text-white text-center p-2 rounded-lg font-black text-xs mb-3 animate-bounce">¡PREMIO: 10º SELLO DETECTADO!</div>' : ''}
                        <h2 class="text-2xl font-black text-neutral-800">${data.name}</h2>
                        <p class="text-xs text-gray-500 mb-4">${userDoc.id}</p>
                        <div class="bg-neutral-100 p-4 rounded-2xl mb-4 flex justify-between items-center">
                            <div><p class="text-[10px] font-bold text-neutral-400">TIPO</p><p class="font-black text-orange-600">${data.pin_type}</p></div>
                            <div class="text-right"><p class="text-[10px] font-bold text-neutral-400">ACTUAL</p><p class="text-xl font-black">${currentStamps}/10</p></div>
                        </div>
                        <button onclick="confirmarEntrega('${userDoc.id}', '${data.pin_type}', ${currentStamps})" class="w-full py-5 bg-green-600 text-white rounded-2xl font-black uppercase shadow-lg">Confirmar Acción</button>
                    </div>`;
            } else {
                infoDiv.innerHTML = `<div class="bg-red-500/20 border-2 border-red-500 p-4 rounded-2xl text-center text-red-500 font-black">PIN INVÁLIDO</div>`;
            }
        };

        window.confirmarEntrega = async (email, tipo, stamps) => {
            if(confirm('¿Procesar esta solicitud?')){
                const userRef = doc(db, "users", email);
                let updates = { active_pin: deleteField(), pin_timestamp: deleteField(), pin_type: deleteField(), lastUpdate: new Date() };
                
                if(tipo === 'SELLO') {
                    updates.stamps = (stamps >= 9) ? 0 : stamps + 1;
                } else if(tipo === 'TABLERO') {
                    updates.stamps = 0;
                }

                await updateDoc(userRef, updates);
                alert("¡Hecho! Tarjeta actualizada.");
                location.reload();
            }
        };
    </script>
</head>
<body class="bg-neutral-900 p-6 flex flex-col items-center min-h-screen font-sans">
    <div class="w-full max-w-sm text-center mb-8">
        <h1 class="text-white font-black text-3xl italic uppercase">SD <span class="text-orange-500">Validator</span></h1>
    </div>
    <div class="w-full max-w-sm mb-8">
        <input type="number" id="search-pin" placeholder="PIN de 4 dígitos" class="w-full p-6 rounded-2xl mb-4 font-black text-4xl text-center outline-none">
        <button onclick="buscarPin()" class="w-full py-5 bg-orange-500 text-white rounded-2xl font-black uppercase text-lg">Verificar PIN</button>
    </div>
    <div id="info-cliente" class="w-full max-w-sm"></div>
</body>
</html>
