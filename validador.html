<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validador | Slice Dog</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc, updateDoc, deleteField } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAFwDQVPy4xRjw4rxcKcZEwNx1suV7eWW8",
            authDomain: "slice-dog-test-firebase.firebaseapp.com",
            projectId: "slice-dog-test-firebase",
            storageBucket: "slice-dog-test-firebase.firebasestorage.app",
            messagingSenderId: "1024055139023",
            appId: "1:1024055139023:web:42985e24651b5a5f38f5ba"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.verificarCliente = async () => {
            const email = document.getElementById('search-email').value.toLowerCase().trim();
            const infoDiv = document.getElementById('info-cliente');
            
            if(!email) return;

            const docSnap = await getDoc(doc(db, "users", email));
            if (docSnap.exists()) {
                const data = docSnap.data();
                infoDiv.innerHTML = `
                    <div class="bg-white p-6 rounded-2xl shadow-lg border-2 border-orange-500">
                        <p class="text-xs font-bold text-gray-400">CLIENTE</p>
                        <h2 class="text-xl font-black mb-4">${data.name}</h2>
                        
                        <div class="bg-orange-100 p-4 rounded-xl mb-4 text-center">
                            <p class="text-xs font-bold text-orange-800">PIN ACTIVO</p>
                            <p class="text-4xl font-black text-orange-600">${data.active_pin || 'NINGUNO'}</p>
                        </div>

                        <button onclick="entregarPremio('${email}')" class="w-full py-4 bg-green-600 text-white rounded-xl font-bold uppercase ${!data.active_pin ? 'hidden' : ''}">
                            Marcar como Entregado
                        </button>
                    </div>
                `;
            } else {
                infoDiv.innerHTML = `<p class="text-red-500 font-bold">Cliente no encontrado.</p>`;
            }
        };

        window.entregarPremio = async (email) => {
            if(confirm("¿Confirmas que entregaste el premio? Esto borrará el PIN del cliente.")){
                await updateDoc(doc(db, "users", email), {
                    active_pin: deleteField()
                });
                alert("Premio entregado. El cliente ya puede volver a juntar sellos.");
                location.reload();
            }
        };
    </script>
</head>
<body class="bg-neutral-900 p-6 flex flex-col items-center min-h-screen font-sans">
    <h1 class="text-white font-black text-2xl mb-8 italic">VALIDADOR DE <span class="text-orange-500">PREMIOS</span></h1>
    
    <div class="w-full max-w-sm mb-6">
        <input type="email" id="search-email" placeholder="Correo del cliente" class="w-full p-4 rounded-xl mb-2 font-bold outline-none">
        <button onclick="verificarCliente()" class="w-full py-4 bg-orange-500 text-white rounded-xl font-black uppercase">Buscar PIN</button>
    </div>

    <div id="info-cliente" class="w-full max-w-sm">
        </div>
</body>
</html>
