<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SLICE DOG | Firebase Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // 1. Tu Configuración de Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyAFwDQVPy4xRjw4rxcKcZEwNx1suV7eWW8",
            authDomain: "slice-dog-test-firebase.firebaseapp.com",
            projectId: "slice-dog-test-firebase",
            storageBucket: "slice-dog-test-firebase.firebasestorage.app",
            messagingSenderId: "1024055139023",
            appId: "1:1024055139023:web:42985e24651b5a5f38f5ba"
        };

        // Inicializar Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // --- ESTILOS ---
        const style = document.createElement('style');
        style.innerHTML = `
            @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
            :root { --sd-mustard: #e9a124; --sd-dark: #4a2311; --sd-bg: #f3e5d0; }
            body { font-family: 'Inter', sans-serif; background-color: var(--sd-bg); color: var(--sd-dark); margin: 0; }
            .italic-black { font-weight: 900; font-style: italic; text-transform: uppercase; }
            .stamp-active { background: linear-gradient(135deg, var(--sd-mustard) 0%, #d48a1a 100%); color: white; border: none; }
            .coupon-card { min-width: 260px; background: white; border: 2px dashed var(--sd-mustard); border-radius: 1.5rem; padding: 1.5rem; position: relative; snap-align: center; }
            .scrollbar-hide::-webkit-scrollbar { display: none; }
            #reader { width: 100% !important; border: none !important; border-radius: 2rem; overflow: hidden; }
        `;
        document.head.appendChild(style);

        // --- VARIABLES GLOBALES ---
        let userData = JSON.parse(localStorage.getItem("sd_user_email"));
        let html5QrCode;

        // --- FUNCIONES CORE ---

        async function registerUser() {
            const name = document.getElementById('reg-name').value;
            const email = document.getElementById('reg-email').value.toLowerCase().trim();
            const wa = document.getElementById('reg-whatsapp').value;

            if(!name || !email || !wa) return alert("Completa los datos");

            const btn = document.getElementById('btn-register');
            btn.innerText = "CREANDO CUENTA...";
            btn.disabled = true;

            const newUser = {
                name: name,
                email: email,
                whatsapp: wa,
                stamps: 1, // Regalo de bienvenida
                cupon_bienvenida: "LISTO",
                cupon_cumple: "LISTO",
                lastUpdate: new Date()
            };

            await setDoc(doc(db, "users", email), newUser);
            localStorage.setItem("sd_user_email", JSON.stringify(email));
            location.reload();
        }

        function listenToUserUpdates(email) {
            onSnapshot(doc(db, "users", email), (doc) => {
                if (doc.exists()) {
                    renderApp(doc.data());
                } else {
                    localStorage.removeItem("sd_user_email");
                    location.reload();
                }
            });
        }

        async function addStamp(email, currentStamps) {
            if(currentStamps >= 10) return alert("Ya completaste tu tablero. ¡Canjea tu premio!");
            
            const userRef = doc(db, "users", email);
            await updateDoc(userRef, {
                stamps: currentStamps + 1,
                lastUpdate: new Date()
            });
        }

        async function useCoupon(email, type) {
            const pin = Math.floor(100 + Math.random() * 900);
            if(confirm(`¿Canjear cupón?\nDicta el PIN: ${pin} al encargado.`)) {
                const userRef = doc(db, "users", email);
                const updateData = { active_pin: pin };
                
                if(type === 'TABLERO') {
                    updateData.stamps = 0;
                } else {
                    updateData[type] = "USADO";
                }

                await updateDoc(userRef, updateData);
            }
        }

        // --- INTERFAZ ---
        function renderApp(data) {
            document.getElementById('register-modal').classList.add('hidden');
            document.getElementById('main-ui').classList.remove('hidden');
            document.getElementById('user-greeting').innerText = `HOLA, ${data.name} 🍕`;

            // Título y Lógica de 10 sellos
            const statusEl = document.getElementById('status-title');
            const currentStamps = data.stamps || 0;
            
            if (currentStamps >= 10) {
                statusEl.innerText = "¡PREMIO LISTO!";
                statusEl.classList.add("text-orange-600");
                document.getElementById('action-btn-container').innerHTML = `
                    <button id="btn-claim" class="w-full py-5 bg-black text-white rounded-[1.8rem] italic-black flex items-center justify-center gap-3 shadow-lg">
                        <i data-lucide="star"></i> ${data.active_pin ? 'PIN: ' + data.active_pin : 'CANJEAR PIZZA GRATIS'}
                    </button>
                `;
                if(!data.active_pin) {
                    document.getElementById('btn-claim').onclick = () => useCoupon(data.email, 'TABLERO');
                }
            } else {
                statusEl.innerText = `FALTAN ${10 - currentStamps} PARA PREMIO`;
                statusEl.classList.remove("text-orange-600");
                document.getElementById('action-btn-container').innerHTML = `
                    <button id="btn-scan" class="w-full py-5 bg-[var(--sd-mustard)] text-white rounded-[1.8rem] italic-black flex items-center justify-center gap-3 shadow-lg">
                        <i data-lucide="qr-code"></i> ¡SOLICITAR SELLO!
                    </button>
                `;
                document.getElementById('btn-scan').onclick = () => openScanner(data.email, currentStamps);
            }

            // Grid de Sellos
            const grid = document.getElementById('stamps-grid');
            grid.innerHTML = '';
            for(let i=0; i<10; i++) {
                const active = i < currentStamps;
                const slot = document.createElement('div');
                slot.className = `aspect-square rounded-2xl flex items-center justify-center border-2 ${active ? 'stamp-active' : 'border-dashed border-neutral-300 bg-neutral-50/50'}`;
                slot.innerHTML = active ? (i === 9 ? '<i data-lucide="gift"></i>' : '<i data-lucide="pizza"></i>') : (i === 9 ? '<i data-lucide="gift" class="text-neutral-300"></i>' : '');
                grid.appendChild(slot);
            }

            // Cupones
            const carousel = document.getElementById('rewards-carousel');
            carousel.innerHTML = '';
            const coupons = [
                { id: 'cupon_bienvenida', title: '🎁 BIENVENIDA', gift: 'Bebida Gratis', status: data.cupon_bienvenida },
                { id: 'cupon_cumple', title: '🎂 CUMPLE', gift: 'Rebanada Gratis', status: data.cupon_cumple }
            ];

            let hasCoupons = false;
            coupons.forEach(c => {
                if(c.status === "LISTO") {
                    hasCoupons = true;
                    const card = document.createElement('div');
                    card.className = 'coupon-card text-center';
                    card.innerHTML = `
                        <p class="text-[9px] font-bold uppercase text-orange-500 mb-1">${c.title}</p>
                        <h4 class="italic-black text-lg mb-4">${c.gift}</h4>
                        <button class="w-full py-3 bg-black text-white rounded-xl text-[10px] font-black uppercase">Canjear</button>
                    `;
                    card.querySelector('button').onclick = () => useCoupon(data.email, c.id);
                    carousel.appendChild(card);
                }
            });
            document.getElementById('section-rewards').classList.toggle('hidden', !hasCoupons);
            
            lucide.createIcons();
        }

        // --- ESCÁNER ---
        window.openScanner = (email, currentStamps) => {
            document.getElementById('scanner-modal').classList.remove('hidden');
            html5QrCode = new Html5Qrcode("reader");
            html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, 
                async (text) => {
                    if(text.includes("SD-") || text === "SLICE_DOG_STAMP") {
                        await html5QrCode.stop();
                        document.getElementById('scanner-modal').classList.add('hidden');
                        addStamp(email, currentStamps);
                    }
                }
            );
        };

        window.closeScanner = async () => {
            if(html5QrCode) await html5QrCode.stop();
            document.getElementById('scanner-modal').classList.add('hidden');
        };

        // --- INICIO ---
        window.onload = () => {
            if(userData) listenToUserUpdates(userData);
            else document.getElementById('register-modal').classList.remove('hidden');
            
            document.getElementById('btn-register').onclick = registerUser;
            lucide.createIcons();
        };
    </script>
</head>
<body class="min-h-screen flex flex-col items-center p-4">

    <header class="w-full max-w-md text-center py-6">
        <h1 class="italic-black text-2xl">Slice Dog <span class="text-orange-600">Club</span></h1>
    </header>

    <main id="main-ui" class="w-full max-w-md hidden">
        <div class="bg-white rounded-[2.5rem] p-8 text-center shadow-xl mb-6">
            <p id="user-greeting" class="text-[10px] font-black uppercase text-neutral-400 mb-1"></p>
            <h2 id="status-title" class="italic-black text-2xl mb-8 leading-none"></h2>
            <div id="stamps-grid" class="grid grid-cols-5 gap-3 mb-10"></div>
            <div id="action-btn-container"></div>
        </div>

        <div id="section-rewards" class="hidden w-full overflow-hidden mb-8">
            <h3 class="text-[10px] font-black uppercase text-neutral-400 mb-3 px-2">Mis Regalos Disponibles</h3>
            <div id="rewards-carousel" class="flex gap-4 overflow-x-auto pb-6 px-2 snap-x scrollbar-hide"></div>
        </div>

        <section class="w-full px-2 mb-10">
            <div class="bg-white/50 rounded-2xl p-6 border border-white">
                <h4 class="text-[10px] font-black mb-4 uppercase text-neutral-500 flex items-center gap-2">
                    <i data-lucide="info" class="w-3"></i> Reglas del Club
                </h4>
                <ul class="text-[11px] space-y-3 text-neutral-600 font-medium">
                    <li>• 1 sello por cada compra mínima de $100.</li>
                    <li>• Al completar 10 sellos, tu siguiente pizza es gratis.</li>
                </ul>
            </div>
        </section>
    </main>

    <div id="scanner-modal" class="fixed inset-0 bg-black/95 z-[200] flex flex-col items-center justify-center p-6 hidden">
        <div class="w-full max-w-sm bg-white rounded-[3rem] p-4">
            <div id="reader"></div>
            <button onclick="closeScanner()" class="mt-4 w-full py-3 text-xs font-bold uppercase text-black">Cancelar</button>
        </div>
    </div>

    <div id="register-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-[100] flex items-center justify-center p-6 hidden">
        <div class="bg-white w-full max-w-sm rounded-[3rem] p-8 text-center border-4 border-[var(--sd-mustard)] shadow-2xl">
            <h2 class="italic-black text-2xl mb-6">Unirse al Club</h2>
            <input type="text" id="reg-name" placeholder="Tu Nombre" class="w-full p-4 mb-3 bg-neutral-100 rounded-xl font-bold text-center outline-none">
            <input type="email" id="reg-email" placeholder="Correo" class="w-full p-4 mb-3 bg-neutral-100 rounded-xl font-bold text-center outline-none">
            <input type="tel" id="reg-whatsapp" placeholder="WhatsApp" class="w-full p-4 mb-6 bg-neutral-100 rounded-xl font-bold text-center outline-none">
            <button id="btn-register" class="w-full py-5 bg-black text-white rounded-[1.8rem] italic-black">¡Empezar!</button>
        </div>
    </div>

</body>
</html>
