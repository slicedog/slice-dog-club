<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slice Dog Club | v4.1 PRO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        :root { --sd-mustard: #e9a124; --sd-dark: #4a2311; --sd-bg: #f3e5d0; }
        body { font-family: 'Inter', sans-serif; background-color: var(--sd-bg); color: var(--sd-dark); margin: 0; }
        .italic-black { font-weight: 900; font-style: italic; text-transform: uppercase; }
        .stamp-active { background: linear-gradient(135deg, var(--sd-mustard) 0%, #d48a1a 100%); color: white; border: none; }
        .btn-disabled { background-color: #a3a3a3 !important; opacity: 0.6 !important; cursor: not-allowed !important; pointer-events: none !important; }
        #reader { width: 100% !important; border: none !important; border-radius: 2rem; overflow: hidden; }
        .coupon-card { min-width: 260px; background: white; border: 2px dashed var(--sd-mustard); border-radius: 1.5rem; padding: 1.5rem; snap-align: center; }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAFwDQVPy4xRjw4rxcKcZEwNx1suV7eWW8",
            authDomain: "slice-dog-test-firebase.firebaseapp.com",
            projectId: "slice-dog-test-firebase",
            storageBucket: "slice-dog-test-firebase.firebasestorage.app",
            messagingSenderId: "1024055139023",
            appId: "1:1024055139023:web:42985e24651b5a5f38f5ba"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const SECRET_SALT = "SD2026"; 
        const BLOQUE_TIEMPO_MS = 180000; 
        const COOLDOWN_TIME = 60000; // 1 minuto de bloqueo tras sellar

        let userData = JSON.parse(localStorage.getItem("sd_user_email"));
        let html5QrCode;

        // --- REGISTRO ---
        async function registerUser() {
            const name = document.getElementById('reg-name').value;
            const email = document.getElementById('reg-email').value.toLowerCase().trim();
            const wa = document.getElementById('reg-whatsapp').value;
            if(!name || !email || !wa) return alert("Completa los datos");
            try {
                const userRef = doc(db, "users", email);
                const userSnap = await getDoc(userRef);
                if (userSnap.exists()) {
                    localStorage.setItem("sd_user_email", JSON.stringify(email));
                    location.reload();
                } else {
                    await setDoc(userRef, { name, email, whatsapp: wa, stamps: 1, cupon_bienvenida: "LISTO", cupon_cumple: "LISTO", lastUpdate: new Date() });
                    localStorage.setItem("sd_user_email", JSON.stringify(email));
                    location.reload();
                }
            } catch (e) { alert("Error al registrar"); }
        }

        // --- ESCÁNER ---
        window.openScanner = (email, currentStamps) => {
            const btn = document.getElementById('btn-scan');
            if(btn.classList.contains('btn-disabled')) return;
            document.getElementById('scanner-modal').classList.remove('hidden');
            html5QrCode = new Html5Qrcode("reader");
            html5QrCode.start({ facingMode: "environment" }, { fps: 15, qrbox: 250 }, 
                async (text) => {
                    await window.closeScanner();
                    const scannedText = text.trim();
                    const now = Date.now();
                    const b1 = Math.floor(now / BLOQUE_TIEMPO_MS);
                    const b2 = b1 - 1;
                    const t1 = btoa(b1 + "_" + SECRET_SALT);
                    const t2 = btoa(b2 + "_" + SECRET_SALT);

                    if (scannedText === t1 || scannedText === t2) {
                        localStorage.setItem("sd_last_stamp_time", Date.now());
                        await updateDoc(doc(db, "users", email), { stamps: currentStamps + 1, lastUpdate: new Date() });
                    } else {
                        alert("❌ QR EXPIRADO\nEscanea el código actualizado en la pantalla.");
                    }
                }
            ).catch(e => console.error(e));
        };

        window.closeScanner = async () => {
            if(html5QrCode) { await html5QrCode.stop(); html5QrCode = null; }
            document.getElementById('scanner-modal').classList.add('hidden');
        };

        // --- CANJE CON AUTO-RESTAURACIÓN ---
      async function useCoupon(email, type) {
    // NUEVO: Verificamos si ya existe un PIN activo en los datos locales antes de proceder
    // Esto evita que se generen múltiples PINs seguidos
    const userRef = doc(db, "users", email);
    const snap = await getDoc(userRef);
    
    if (snap.exists() && snap.data().active_pin) {
        alert("⚠️ YA TIENES UN CANJE EN PROCESO\nDebes terminar el canje actual o esperar a que expire antes de solicitar otro.");
        return;
    }

    const pin = Math.floor(100 + Math.random() * 900);
    if(confirm(`¿Generar PIN de canje?\nTienes 5 minutos para que el Staff lo valide.`)) {
        const updateData = { 
            active_pin: pin, 
            pin_type: type, 
            pin_timestamp: Date.now() 
        };
        if(type === 'TABLERO') updateData.stamps = 0;
        else updateData[type] = "PROCESANDO"; 
        await updateDoc(userRef, updateData);
    }
}

        // --- RENDERIZADO PRINCIPAL ---
        function renderApp(data) {
            document.getElementById('register-modal').classList.add('hidden');
            document.getElementById('main-ui').classList.remove('hidden');
            document.getElementById('user-greeting').innerText = `HOLA, ${data.name} 🍕`;
            
            const statusEl = document.getElementById('status-title');
            const btnContainer = document.getElementById('action-btn-container');

            // LÓGICA DE PIN ACTIVO / EXPIRACIÓN
            if (data.active_pin) {
                const ahora = Date.now();
                const transcurrido = ahora - (data.pin_timestamp || 0);
                const limite = 5 * 60 * 1000; // 5 minutos

                if (transcurrido > limite) {
                    // AUTO-RESTAURAR: El tiempo pasó
                    const userRef = doc(db, "users", data.email);
                    const reset = { active_pin: null, pin_timestamp: null, pin_type: null };
                    if(data.pin_type === 'TABLERO') reset.stamps = 10;
                    else reset[data.pin_type] = "LISTO";
                    updateDoc(userRef, reset);
                    return;
                }

                const restantes = Math.ceil((limite - transcurrido) / 1000);
                const m = Math.floor(restantes / 60);
                const s = restantes % 60;

                statusEl.innerText = "MUESTRA EL PIN";
                btnContainer.innerHTML = `
                    <div class="w-full py-5 bg-orange-600 text-white rounded-[1.8rem] italic-black flex flex-col items-center justify-center shadow-lg animate-pulse">
                        <span class="text-4xl tracking-[0.3em] ml-3">${data.active_pin}</span>
                        <span class="text-[10px] mt-2 opacity-80 uppercase font-bold">Expira en ${m}:${s < 10 ? '0' : ''}${s}</span>
                    </div>`;
            } else {
                // FLUJO NORMAL (SIN PIN)
                const currentStamps = data.stamps || 0;
                if (currentStamps >= 10) {
                    statusEl.innerText = "¡PREMIO LISTO!";
                    btnContainer.innerHTML = `<button id="btn-claim" class="w-full py-5 bg-orange-600 text-white rounded-[1.8rem] italic-black shadow-lg uppercase">Obtener PIN de Canje</button>`;
                    document.getElementById('btn-claim').onclick = () => useCoupon(data.email, 'TABLERO');
                } else {
                    statusEl.innerText = `FALTAN ${10 - currentStamps} PARA PREMIO`;
                    btnContainer.innerHTML = `<button id="btn-scan" class="w-full py-5 bg-[var(--sd-mustard)] text-white rounded-[1.8rem] italic-black flex items-center justify-center gap-3 shadow-lg uppercase"><i data-lucide="qr-code"></i> Solicitar Sello</button>`;
                    const lastS = localStorage.getItem("sd_last_stamp_time");
                    if (lastS && (Date.now() - lastS < COOLDOWN_TIME)) startCooldownTimer(COOLDOWN_TIME - (Date.now() - lastS));
                    else document.getElementById('btn-scan').onclick = () => openScanner(data.email, currentStamps);
                }

                // Grid de sellos
                const grid = document.getElementById('stamps-grid');
                grid.innerHTML = '';
                for(let i=0; i<10; i++) {
                    const active = i < currentStamps;
                    const slot = document.createElement('div');
                    slot.className = `aspect-square rounded-2xl flex items-center justify-center border-2 ${active ? 'stamp-active' : 'border-dashed border-neutral-300 bg-neutral-50/50'}`;
                    slot.innerHTML = active ? (i === 9 ? '<i data-lucide="gift"></i>' : '<i data-lucide="pizza"></i>') : (i === 9 ? '<i data-lucide="gift" class="text-neutral-300"></i>' : '');
                    grid.appendChild(slot);
                }
            }

            // Cupones extra
            // ... dentro de renderApp(data) ...
const carousel = document.getElementById('rewards-carousel');
carousel.innerHTML = '';

const cupones = [
    {id:'cupon_bienvenida', t:'🎁 BIENVENIDA', g:'Bebida'},
    {id:'cupon_cumple', t:'🎂 CUMPLE', g:'Rebanada'}
];

cupones.forEach(c => {
    if(data[c.id] === "LISTO") {
        const card = document.createElement('div');
        card.className = 'coupon-card text-center';
        
        // CAMBIO: Si hay un active_pin, desactivamos el botón visualmente
        const isBusy = data.active_pin ? 'opacity-20 pointer-events-none' : '';
        
        card.innerHTML = `
            <p class="text-[9px] font-black text-orange-500 mb-1 uppercase">${c.t}</p>
            <h4 class="italic-black text-lg mb-4 uppercase">${c.g} GRATIS</h4>
            <button class="w-full py-3 bg-black text-white rounded-xl text-[10px] font-black uppercase ${isBusy}">
                ${data.active_pin ? 'Bloqueado' : 'Canjear'}
            </button>`;
        
        if(!data.active_pin) {
            card.querySelector('button').onclick = () => useCoupon(data.email, c.id);
        }
        carousel.appendChild(card);
    }
});

        function startCooldownTimer(remainingMs) {
            const btn = document.getElementById('btn-scan');
            if(!btn) return;
            btn.classList.add('btn-disabled');
            let seconds = Math.ceil(remainingMs / 1000);
            const interval = setInterval(() => {
                seconds--;
                btn.innerHTML = `<i data-lucide="clock" class="w-4 h-4"></i> ESPERA (${seconds}s)`;
                if (seconds <= 0) { clearInterval(interval); location.reload(); }
            }, 1000);
        }

        window.onload = () => {
            if(userData) {
                onSnapshot(doc(db, "users", userData), (doc) => { if(doc.exists()) renderApp(doc.data()); });
                // Refresco visual cada segundo para el contador del PIN
                setInterval(() => {
                    const email = JSON.parse(localStorage.getItem("sd_user_email"));
                    if(email) {
                        getDoc(doc(db, "users", email)).then(s => { if(s.exists() && s.data().active_pin) renderApp(s.data()); });
                    }
                }, 1000);
            } else {
                document.getElementById('register-modal').classList.remove('hidden');
            }
            document.getElementById('btn-register').onclick = registerUser;
            lucide.createIcons();
        };
    </script>
</head>
<body class="min-h-screen flex flex-col items-center p-4">
    <header class="w-full max-w-md text-center py-8">
        <h1 class="italic-black text-2xl tracking-tighter">Slice Dog <span class="text-orange-600">Club</span> <span class="text-[8px] text-gray-400">v4.1</span></h1>
    </header>

    <main id="main-ui" class="w-full max-w-md hidden">
        <div class="bg-white rounded-[2.5rem] p-8 text-center shadow-xl mb-6 border-b-8 border-orange-500/10">
            <p id="user-greeting" class="text-[10px] font-black text-neutral-400 mb-2 tracking-widest uppercase"></p>
            <h2 id="status-title" class="italic-black text-3xl mb-8 leading-none"></h2>
            <div id="stamps-grid" class="grid grid-cols-5 gap-3 mb-10"></div>
            <div id="action-btn-container"></div>
        </div>

        <div class="w-full overflow-hidden mb-8">
            <h3 class="text-[10px] font-black text-neutral-400 mb-3 px-2 tracking-widest uppercase">Premios Especiales</h3>
            <div id="rewards-carousel" class="flex gap-4 overflow-x-auto pb-6 px-2 snap-x scrollbar-hide"></div>
        </div>
    </main>

    <div id="scanner-modal" class="fixed inset-0 bg-black/95 z-[200] flex flex-col items-center justify-center p-6 hidden">
        <div class="w-full max-w-sm bg-white rounded-[3rem] p-4 text-center">
            <div id="reader"></div>
            <button onclick="closeScanner()" class="mt-4 py-4 text-xs font-black text-neutral-400 uppercase tracking-widest">Cancelar Escaneo</button>
        </div>
    </div>

    <div id="register-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-[100] flex items-center justify-center p-6 hidden">
        <div class="bg-white w-full max-w-sm rounded-[3rem] p-8 text-center border-4 border-orange-400 shadow-2xl">
            <h2 class="italic-black text-2xl mb-6 leading-none">Bienvenido al<br>Club</h2>
            <input type="text" id="reg-name" placeholder="Tu Nombre" class="w-full p-4 mb-3 bg-neutral-100 rounded-2xl font-bold text-center border-none">
            <input type="email" id="reg-email" placeholder="Tu Correo" class="w-full p-4 mb-3 bg-neutral-100 rounded-2xl font-bold text-center border-none">
            <input type="tel" id="reg-whatsapp" placeholder="Tu WhatsApp" class="w-full p-4 mb-6 bg-neutral-100 rounded-2xl font-bold text-center border-none">
            <button id="btn-register" class="w-full py-5 bg-black text-white rounded-[1.8rem] italic-black shadow-lg">OBTENER MI PRIMER SELLO</button>
        </div>
    </div>
</body>
</html>
