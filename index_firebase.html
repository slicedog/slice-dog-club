<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slice Dog | QR DINÁMICO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #4a2311; color: white; margin: 0; overflow: hidden; }
        .italic-black { font-weight: 900; font-style: italic; text-transform: uppercase; }
        #qrcode img { display: inline-block; border-radius: 2rem; border: 12px solid white; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-6 text-center">

    <div class="mb-6">
        <div class="bg-orange-500 text-white p-4 rounded-3xl inline-block mb-4 shadow-xl animate-pulse">
            <i data-lucide="shield-check" class="w-12 h-12"></i>
        </div>
        <h1 class="italic-black text-4xl mb-2">CÓDIGO <span class="text-orange-500">VIVO</span></h1>
        <p class="text-xs tracking-[0.3em] font-bold opacity-40 uppercase">Seguridad Nivel Búnker</p>
    </div>

    <div id="qrcode" class="bg-white p-6 rounded-[3rem] mb-8 transition-all duration-500"></div>

    <div class="bg-white/10 backdrop-blur-xl p-8 rounded-[2.5rem] border border-white/20 w-full max-w-sm">
        <p class="text-[10px] uppercase font-black opacity-50 mb-2 tracking-widest">El código expira en:</p>
        <p id="timer-text" class="text-orange-400 font-black text-5xl italic tracking-tighter">00:00</p>
    </div>

    <script>
        // ESTA CLAVE DEBE SER SECRETA Y LA MISMA EN AMBOS ARCHIVOS
        const SECRET_SALT = "SliceDog_Super_Secret_2026"; 

        function getIntervalToken() {
            const now = new Date();
            const interval = Math.floor(now.getMinutes() / 3); // Bloques de 3 min
            const timeString = `${now.getFullYear()}-${now.getMonth()+1}-${now.getDate()}-${now.getHours()}-${interval}`;
            return btoa(SECRET_SALT + timeString).substring(0, 14); 
        }

        function updateUI() {
            const token = getIntervalToken();
            const qrContainer = document.getElementById('qrcode');
            
            // Solo regenerar si el token cambió para evitar parpadeo
            if (qrContainer.dataset.token !== token) {
                qrContainer.dataset.token = token;
                qrContainer.innerHTML = "";
                const qr = qrcode(0, 'H');
                qr.addData(token);
                qr.make();
                qrContainer.innerHTML = qr.createImgTag(10, 0);
            }

            // Cuenta regresiva de 3 minutos (180 segundos)
            const now = new Date();
            const secondsInInterval = (now.getMinutes() % 3) * 60 + now.getSeconds();
            const remaining = 180 - secondsInInterval;
            
            const mins = Math.floor(remaining / 60);
            const secs = remaining % 60;
            document.getElementById('timer-text').innerText = `${mins}:${secs < 10 ? '0' : ''}${secs}`;
            
            // Si falta poco, poner el tiempo en rojo
            if(remaining < 20) {
                document.getElementById('timer-text').classList.add('text-red-500');
                document.getElementById('timer-text').classList.remove('text-orange-400');
            } else {
                document.getElementById('timer-text').classList.remove('text-red-500');
                document.getElementById('timer-text').classList.add('text-orange-400');
            }
        }

        setInterval(updateUI, 1000);
        updateUI();
        lucide.createIcons();
    </script>
</body>
</html>
