<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slice Dog Club | v3.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        :root { --sd-mustard: #e9a124; --sd-dark: #4a2311; --sd-bg: #f3e5d0; }
        body { font-family: 'Inter', sans-serif; background-color: var(--sd-bg); color: var(--sd-dark); margin: 0; }
        .italic-black { font-weight: 900; font-style: italic; text-transform: uppercase; }
        .stamp-active { background: linear-gradient(135deg, var(--sd-mustard) 0%, #d48a1a 100%); color: white; border: none; }
        .btn-disabled { background-color: #a3a3a3 !important; opacity: 0.6 !important; cursor: not-allowed !important; pointer-events: none !important; }
        #reader { width: 100% !important; border: none !important; border-radius: 2rem; overflow: hidden; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .coupon-card { min-width: 260px; background: white; border: 2px dashed var(--sd-mustard); border-radius: 1.5rem; padding: 1.5rem; snap-align: center; }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAFwDQVPy4xRjw4rxcKcZEwNx1suV7eWW8",
            authDomain: "slice-dog-test-firebase.firebaseapp.com",
            projectId: "slice-dog-test-firebase",
            storageBucket: "slice-dog-test-firebase.firebasestorage.app",
            messagingSenderId: "1024055139023",
            appId: "1:1024055139023:web:42985e24651b5a5f38f5ba"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const SECRET_SALT = "SLICE_DOG_PRO_2026"; 
        const BLOQUE_TIEMPO_MS = 180000; 
        const COOLDOWN_TIME = 60000;

        let userData = JSON.parse(localStorage.getItem("sd_user_email"));
        let html5QrCode;

        async function registerUser() {
            const name = document.getElementById('reg-name').value;
            const email = document.getElementById('reg-email').value.toLowerCase().trim();
            const wa = document.getElementById('reg-whatsapp').value;
            if(!name || !email || !wa) return alert("Completa los datos");
            try {
                const userRef = doc(db, "users", email);
                const userSnap = await getDoc(userRef);
                if (userSnap.exists()) {
                    localStorage.setItem("sd_user_email", JSON.stringify(email));
                    location.reload();
                } else {
                    await setDoc(userRef, { name, email, whatsapp: wa, stamps: 1, cupon_bienvenida: "LISTO", cupon_cumple: "LISTO", lastUpdate: new Date() });
                    localStorage.setItem("sd_user_email", JSON.stringify(email));
                    location.reload();
                }
            } catch (e) { alert("Error"); }
        }

        window.openScanner = (email, currentStamps) => {
            const btn = document.getElementById('btn-scan');
            if(btn.classList.contains('btn-disabled')) return;

            document.getElementById('scanner-modal').classList.remove('hidden');
            html5QrCode = new Html5Qrcode("reader");

            html5QrCode.start({ facingMode: "environment" }, { fps: 15, qrbox: 250 }, 
                async (text) => {
                    await window.closeScanner();
                    btn.classList.add('btn-disabled');

                    const qrLimpio = text.trim();
                    const now = Date.now();
                    
                    // Solo permitimos el bloque actual y el anterior (máximo 6 min de vida total)
                    const bloqueActual = Math.floor(now / BLOQUE_TIEMPO_MS);
                    const bloqueAnterior = bloqueActual - 1;

                    const t1 = btoa(SECRET_SALT + bloqueActual).substring(0, 16);
                    const t2 = btoa(SECRET_SALT + bloqueAnterior).substring(0, 16);

                    if (qrLimpio === t1 || qrLimpio === t2) {
                        localStorage.setItem("sd_last_stamp_time", Date.now());
                        const userRef = doc(db, "users", email);
                        await updateDoc(userRef, { stamps: currentStamps + 1, lastUpdate: new Date() });
                    } else {
                        alert("❌ CÓDIGO EXPIRADO\nEsa foto ya no es válida. Escanea el código real de la pantalla.");
                        btn.classList.remove('btn-disabled'); 
                    }
                }
            ).catch(e => console.error(e));
        };

        window.closeScanner = async () => {
            if(html5QrCode) { await html5QrCode.stop(); html5QrCode = null; }
            document.getElementById('scanner-modal').classList.add('hidden');
        };

        function renderApp(data) {
            document.getElementById('register-modal').classList.add('hidden');
            document.getElementById('main-ui').classList.remove('hidden');
            document.getElementById('user-greeting').innerText = `HOLA, ${data.name} 🍕`;
            const currentStamps = data.stamps || 0;
            const statusEl = document.getElementById('status-title');
            const btnContainer = document.getElementById('action-btn-container');

            if (currentStamps >= 10 || data.active_pin) {
                statusEl.innerText = "¡PREMIO LISTO!";
                btnContainer.innerHTML = `<button id="btn-claim" class="w-full py-5 bg-orange-600 text-white rounded-[1.8rem] italic-black flex flex-col items-center justify-center shadow-lg"><span class="text-xs font-bold mb-1">${data.active_pin ? 'PIN DE CANJE' : 'CANJEAR PREMIO'}</span><span class="text-2xl">${data.active_pin ? data.active_pin : 'OBTENER PIN'}</span></button>`;
                if(!data.active_pin) document.getElementById('btn-claim').onclick = () => useCoupon(data.email, 'TABLERO');
            } else {
                statusEl.innerText = `FALTAN ${10 - currentStamps} PARA PREMIO`;
                btnContainer.innerHTML = `<button id="btn-scan" class="w-full py-5 bg-[var(--sd-mustard)] text-white rounded-[1.8rem] italic-black flex items-center justify-center gap-3 shadow-lg"><i data-lucide="qr-code"></i> SOLICITAR SELLO</button>`;
                const lastS = localStorage.getItem("sd_last_stamp_time");
                if (lastS && (Date.now() - lastS < COOLDOWN_TIME)) startCooldownTimer(COOLDOWN_TIME - (Date.now() - lastS));
                else document.getElementById('btn-scan').onclick = () => openScanner(data.email, currentStamps);
            }

            const grid = document.getElementById('stamps-grid');
            grid.innerHTML = '';
            for(let i=0; i<10; i++) {
                const active = i < currentStamps;
                const slot = document.createElement('div');
                slot.className = `aspect-square rounded-2xl flex items-center justify-center border-2 ${active ? 'stamp-active' : 'border-dashed border-neutral-300 bg-neutral-50/50'}`;
                slot.innerHTML = active ? (i === 9 ? '<i data-lucide="gift"></i>' : '<i data-lucide="pizza"></i>') : (i === 9 ? '<i data-lucide="gift" class="text-neutral-300"></i>' : '');
                grid.appendChild(slot);
            }

            const carousel = document.getElementById('rewards-carousel');
            carousel.innerHTML = '';
            [{id:'cupon_bienvenida', t:'🎁 BIENVENIDA', g:'Bebida'}, {id:'cupon_cumple', t:'🎂 CUMPLE', g:'Rebanada'}].forEach(c => {
                if(data[c.id] === "LISTO") {
                    const card = document.createElement('div');
                    card.className = 'coupon-card text-center';
                    card.innerHTML = `<p class="text-[9px] font-black text-orange-500 mb-1">${c.t}</p><h4 class="italic-black text-lg mb-4">${c.g}</h4><button class="w-full py-3 bg-black text-white rounded-xl text-[10px] font-black uppercase">Canjear</button>`;
                    card.querySelector('button').onclick = () => useCoupon(data.email, c.id);
                    carousel.appendChild(card);
                }
            });
            lucide.createIcons();
        }

        function startCooldownTimer(remainingMs) {
            const btn = document.getElementById('btn-scan');
            if(!btn) return;
            btn.classList.add('btn-disabled');
            let seconds = Math.ceil(remainingMs / 1000);
            const interval = setInterval(() => {
                seconds--;
                btn.innerHTML = `<i data-lucide="clock" class="w-4 h-4"></i> ESPERA (${seconds}s)`;
                if (seconds <= 0) { clearInterval(interval); location.reload(); }
            }, 1000);
        }

        async function useCoupon(email, type) {
            const pin = Math.floor(100 + Math.random() * 900);
            if(confirm(`¿Canjear?\nPIN: ${pin}`)) {
                const userRef = doc(db, "users", email);
                const updateData = { active_pin: pin };
                if(type === 'TABLERO') updateData.stamps = 0;
                else updateData[type] = "USADO";
                await updateDoc(userRef, updateData);
            }
        }

        window.onload = () => {
            if(userData) onSnapshot(doc(db, "users", userData), (doc) => { if(doc.exists()) renderApp(doc.data()); });
            else document.getElementById('register-modal').classList.remove('hidden');
            document.getElementById('btn-register').onclick = registerUser;
            lucide.createIcons();
        };
    </script>
</head>
<body class="min-h-screen flex flex-col items-center p-4">
    <header class="w-full max-w-md text-center py-8">
        <h1 class="italic-black text-2xl tracking-tighter">Slice Dog <span class="text-orange-600">Club</span> <span class="text-[8px] text-gray-400">v3.0</span></h1>
    </header>

    <main id="main-ui" class="w-full max-w-md hidden">
        <div class="bg-white rounded-[2.5rem] p-8 text-center shadow-xl mb-6 border-b-8 border-orange-500/10">
            <p id="user-greeting" class="text-[10px] font-black text-neutral-400 mb-2 tracking-widest"></p>
            <h2 id="status-title" class="italic-black text-3xl mb-8 leading-none"></h2>
            <div id="stamps-grid" class="grid grid-cols-5 gap-3 mb-10"></div>
            <div id="action-btn-container"></div>
        </div>
        <div class="w-full overflow-hidden mb-8">
            <h3 class="text-[10px] font-black text-neutral-400 mb-3 px-2 tracking-widest uppercase">Premios</h3>
            <div id="rewards-carousel" class="flex gap-4 overflow-x-auto pb-6 px-2 snap-x scrollbar-hide"></div>
        </div>
    </main>

    <div id="scanner-modal" class="fixed inset-0 bg-black/95 z-[200] flex flex-col items-center justify-center p-6 hidden">
        <div class="w-full max-w-sm bg-white rounded-[3rem] p-4 text-center">
            <div id="reader"></div>
            <button onclick="closeScanner()" class="mt-4 py-4 text-xs font-black text-neutral-400 uppercase">Cancelar</button>
        </div>
    </div>

    <div id="register-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-[100] flex items-center justify-center p-6 hidden">
        <div class="bg-white w-full max-w-sm rounded-[3rem] p-8 text-center border-4 border-orange-400">
            <h2 class="italic-black text-2xl mb-6">Bienvenido</h2>
            <input type="text" id="reg-name" placeholder="Nombre" class="w-full p-4 mb-3 bg-neutral-100 rounded-2xl font-bold text-center">
            <input type="email" id="reg-email" placeholder="Correo" class="w-full p-4 mb-3 bg-neutral-100 rounded-2xl font-bold text-center">
            <input type="tel" id="reg-whatsapp" placeholder="WhatsApp" class="w-full p-4 mb-6 bg-neutral-100 rounded-2xl font-bold text-center">
            <button id="btn-register" class="w-full py-5 bg-black text-white rounded-[1.8rem] italic-black">UNIRSE</button>
        </div>
    </div>
</body>
</html>
