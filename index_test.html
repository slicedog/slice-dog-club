<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TEST | Slice Dog Club</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        :root { --sd-mustard: #e9a124; --sd-dark: #4a2311; --sd-bg: #f3e5d0; }
        body { font-family: 'Inter', sans-serif; background-color: var(--sd-bg); color: var(--sd-dark); margin: 0; overflow-x: hidden; }
        
        .stamp-card { background: #ffffff; border-radius: 2.5rem; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.1); }
        .stamp-active { background: linear-gradient(135deg, var(--sd-mustard) 0%, #d48a1a 100%); color: white !important; border: none !important; transform: scale(1.05); }
        .italic-black { font-weight: 900; font-style: italic; text-transform: uppercase; }
        
        /* ESTILOS CARRUSEL DE CUPONES */
        .coupon-card {
            min-width: 240px;
            background: white;
            border: 2px dashed var(--sd-mustard);
            border-radius: 1.5rem;
            padding: 1.5rem;
            position: relative;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
            snap-align: center;
        }
        .coupon-card::before, .coupon-card::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 20px;
            height: 20px;
            background: var(--sd-bg);
            border-radius: 50%;
            transform: translateY(-50%);
        }
        .coupon-card::before { left: -12px; }
        .coupon-card::after { right: -12px; }

        .sd-input { width: 100%; padding: 1.25rem; background-color: #f9f9f9; border: 2px solid transparent; border-radius: 1.2rem; font-weight: 700; text-align: center; outline: none; margin-bottom: 0.75rem; }
        #reader { width: 100% !important; border: none !important; border-radius: 2rem; overflow: hidden; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4">

    <header class="w-full max-w-md text-center py-6">
        <h1 class="italic-black text-2xl tracking-tight">Slice Dog Club <span class="text-red-500">[TEST]</span></h1>
    </header>

    <main id="main-ui" class="w-full max-w-md hidden">
        <div class="stamp-card p-8 text-center mb-6">
            <p id="user-greeting" class="text-[10px] font-black uppercase text-neutral-400 mb-1"></p>
            <h2 id="status-title" class="italic-black text-2xl mb-8 leading-none"></h2>
            <div id="stamps-grid" class="grid grid-cols-5 gap-3 mb-10"></div>
            
            <button id="btn-scan" onclick="openScanner()" class="w-full py-5 bg-[var(--sd-mustard)] text-white rounded-[1.8rem] italic-black flex items-center justify-center gap-3 shadow-lg">
                <i data-lucide="qr-code"></i> ¡Sellar Compra!
            </button>
        </div>

        <div id="section-rewards" class="hidden w-full overflow-hidden">
            <h3 class="text-[10px] font-black uppercase text-neutral-400 mb-3 px-2">Mis Regalos Disponibles</h3>
            <div id="rewards-carousel" class="flex gap-4 overflow-x-auto pb-6 px-2 snap-x scrollbar-hide">
                </div>
        </div>
    </main>

    <div id="register-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-[100] flex items-center justify-center p-6 hidden">
        <div class="bg-white w-full max-w-sm rounded-[3rem] p-8 text-center border-4 border-[var(--sd-mustard)]">
            <h2 class="italic-black text-2xl mb-6">Únete al Club</h2>
            <input type="text" id="reg-name" placeholder="Tu Nombre" class="sd-input">
            <input type="email" id="reg-email" placeholder="Correo Electrónico" class="sd-input">
            <input type="tel" id="reg-whatsapp" placeholder="WhatsApp" class="sd-input">
            <button id="btn-register" onclick="registerUser()" class="w-full py-5 bg-black text-white rounded-[1.8rem] italic-black">Empezar Ahora</button>
        </div>
    </div>

    <div id="scanner-modal" class="fixed inset-0 bg-black/95 z-[200] flex flex-col items-center justify-center p-6 hidden">
        <div class="w-full max-w-sm bg-white rounded-[3rem] p-4 relative">
            <div id="reader"></div>
            <button onclick="closeScanner()" class="mt-4 w-full py-2 text-xs font-bold uppercase opacity-50">Cerrar</button>
        </div>
    </div>

    <script>
        const CONFIG = {
            maxStamps: 10,
            storageKey: "slice_dog_test_v1",
            scriptURL: "https://script.google.com/macros/s/AKfycbxBt1k6YfvWM45N8GYfalckex_iG4gGIr9sarAN3vzJ5RY6ismgGIut8fGEMOXu374P/exec"
        };

        let user = JSON.parse(localStorage.getItem(CONFIG.storageKey));
        let html5QrCode;

        async function syncWithServer() {
            if(!user) return;
            try {
                const response = await fetch(`${CONFIG.scriptURL}?checkEmail=${encodeURIComponent(user.email)}`);
                const cloudData = await response.json();
                if (cloudData.exists) {
                    user = { ...user, ...cloudData };
                    localStorage.setItem(CONFIG.storageKey, JSON.stringify(user));
                    renderApp();
                }
            } catch(e) { console.log("Error sync"); }
        }

        async function registerUser() {
            const name = document.getElementById('reg-name').value.trim();
            const email = document.getElementById('reg-email').value.trim();
            const whatsapp = document.getElementById('reg-whatsapp').value.trim();
            if(!name || !email || !whatsapp) return alert("Faltan datos");

            try {
                const check = await fetch(`${CONFIG.scriptURL}?checkEmail=${encodeURIComponent(email)}`);
                const res = await check.json();
                
                if (res.exists) {
                    user = res;
                } else {
                    await fetch(CONFIG.scriptURL, {
                        method: 'POST',
                        mode: 'no-cors',
                        body: JSON.stringify({ nombre: name, email: email, whatsapp: whatsapp, sellos: 1, accion: "REGISTRO_NUEVO" })
                    });
                    user = { name, email, whatsapp, stamps: 1, cupon_bienvenida: "LISTO" };
                }
                localStorage.setItem(CONFIG.storageKey, JSON.stringify(user));
                location.reload();
            } catch(e) { alert("Error"); }
        }

        function renderApp() {
            document.getElementById('main-ui').classList.remove('hidden');
            document.getElementById('user-greeting').innerText = `HOLA, ${user.name} 🍕`;
            
            // Render Sellos
            const grid = document.getElementById('stamps-grid');
            grid.innerHTML = '';
            for (let i = 0; i < CONFIG.maxStamps; i++) {
                const active = i < user.stamps;
                const slot = document.createElement('div');
                slot.className = `aspect-square rounded-2xl flex items-center justify-center border-2 ${active ? 'stamp-active' : 'border-dashed border-neutral-200 bg-neutral-50'}`;
                slot.innerHTML = active ? '<i data-lucide="pizza"></i>' : '';
                grid.appendChild(slot);
            }
            document.getElementById('status-title').innerText = `FALTAN ${10 - user.stamps} PARA PREMIO`;

            // Render Cupones (CARRUSEL)
            const rewardsSection = document.getElementById('section-rewards');
            const carousel = document.getElementById('rewards-carousel');
            carousel.innerHTML = '';
            let hasRewards = false;

            const cupones = [
                { id: 'bienvenida', estado: user.cupon_bienvenida, titulo: '🎁 BIENVENIDA', premio: 'Bebida Gratis' },
                { id: 'cumple', estado: user.cupon_cumple, titulo: '🎂 CUMPLEAÑOS', premio: 'Rebanada Gratis' },
                { id: 'extra', estado: user.cupon_extra, titulo: '🍕 EXTRAÑAMOS', premio: '20% Descuento' }
            ];

            cupones.forEach(c => {
                if (c.estado === "LISTO") {
                    hasRewards = true;
                    const card = document.createElement('div');
                    card.className = 'coupon-card text-center';
                    card.innerHTML = `
                        <p class="text-[9px] font-bold uppercase text-orange-500 mb-1">${c.titulo}</p>
                        <h4 class="italic-black text-lg mb-3">${c.premio}</h4>
                        <button onclick="alert('Próximamente: Código de Canje')" class="w-full py-2 bg-black text-white rounded-xl text-[10px] font-black uppercase">Canjear</button>
                    `;
                    carousel.appendChild(card);
                }
            });

            hasRewards ? rewardsSection.classList.remove('hidden') : rewardsSection.classList.add('hidden');
            lucide.createIcons();
        }

        window.onload = () => { 
            if(!user) document.getElementById('register-modal').classList.remove('hidden');
            else { renderApp(); syncWithServer(); }
            lucide.createIcons();
        };

        function openScanner() {
            document.getElementById('scanner-modal').classList.remove('hidden');
            html5QrCode = new Html5Qrcode("reader");
            html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, (text) => {
                alert("QR detectado: " + text);
                closeScanner();
            }).catch(() => alert("Error cámara"));
        }
        function closeScanner() { if(html5QrCode) html5QrCode.stop(); document.getElementById('scanner-modal').classList.add('hidden'); }
    </script>
</body>
</html>
