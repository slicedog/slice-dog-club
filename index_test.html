<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Slice Dog Club</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        :root { --sd-mustard: #eb9a1f; --sd-bg: #f3e5d0; }
        body { font-family: 'Inter', sans-serif; background-color: var(--sd-bg); margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        .italic-black { font-weight: 900; font-style: italic; text-transform: uppercase; }
        .stamp-active { background: linear-gradient(135deg, var(--sd-mustard) 0%, #c97e10 100%); color: white; border: none; }
        #loader { position: fixed; inset: 0; background: var(--sd-bg); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="loader">
        <div class="animate-bounce text-orange-600"><i data-lucide="pizza" size="48"></i></div>
    </div>

    <div class="max-w-md mx-auto p-6">
        <header class="py-8 text-center">
            <h1 class="italic-black text-3xl">SLICE DOG <span class="text-orange-500">CLUB</span></h1>
        </header>

        <main id="main-ui" class="hidden">
            <div class="bg-white rounded-[2.5rem] p-8 shadow-2xl border-b-8 border-neutral-200">
                <p id="user-greeting" class="text-[10px] font-black text-neutral-400 mb-4 uppercase text-center"></p>
                
                <div id="stamps-grid" class="grid grid-cols-5 gap-3 mb-8"></div>

                <div id="action-zone">
                    <button id="main-button" class="w-full py-5 bg-[var(--sd-mustard)] text-white rounded-[1.8rem] italic-black shadow-lg uppercase text-lg transition-transform active:scale-95">
                        Solicitar Sello
                    </button>
                    
                    <div id="pin-display" class="hidden w-full py-6 bg-orange-600 text-white rounded-[2rem] italic-black flex flex-col items-center shadow-lg">
                        <span class="text-[10px] opacity-70 mb-1">CÓDIGO ACTIVO</span>
                        <span id="pin-number" class="text-5xl tracking-widest mb-1">0000</span>
                        <span id="pin-timer" class="text-[10px] font-bold">CARGANDO...</span>
                    </div>
                </div>
            </div>
            <p class="text-[9px] text-center mt-8 font-black text-neutral-400 uppercase tracking-widest italic">Muestra tu código al cajero</p>
        </main>

        <div id="register-modal" class="fixed inset-0 bg-black/90 backdrop-blur-md z-[500] flex items-center justify-center p-6 hidden">
            <div class="bg-white w-full max-w-sm rounded-[3rem] p-8 text-center border-t-8 border-orange-500">
                <h2 class="italic-black text-2xl mb-6">Únete al Club</h2>
                <input type="text" id="reg-name" placeholder="Nombre" class="w-full p-4 mb-3 bg-neutral-100 rounded-2xl font-bold text-center outline-none">
                <input type="email" id="reg-email" placeholder="Email" class="w-full p-4 mb-6 bg-neutral-100 rounded-2xl font-bold text-center outline-none">
                <button id="btn-do-register" class="w-full py-5 bg-black text-white rounded-[1.8rem] italic-black uppercase">Empezar</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc, updateDoc, onSnapshot, deleteField } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAFwDQVPy4xRjw4rxcKcZEwNx1suV7eWW8",
            authDomain: "slice-dog-test-firebase.firebaseapp.com",
            projectId: "slice-dog-test-firebase",
            storageBucket: "slice-dog-test-firebase.firebasestorage.app",
            messagingSenderId: "1024055139023",
            appId: "1:1024055139023:web:42985e24651b5a5f38f5ba"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const COMERCIO_ID = 'slicedog';
        let userEmail = JSON.parse(localStorage.getItem(`sd_user_${COMERCIO_ID}`));

        // --- LÓGICA DE ACTUALIZACIÓN DE UI ---
        function updateUI(data) {
            document.getElementById('loader').classList.add('hidden');
            document.getElementById('main-ui').classList.remove('hidden');
            document.getElementById('user-greeting').innerText = `HOLA, ${data.name || 'PIZZERO'} 🍕`;

            // Dibujar sellos
            const grid = document.getElementById('stamps-grid');
            grid.innerHTML = '';
            for(let i=0; i<10; i++) {
                const active = i < (data.stamps || 0);
                const slot = document.createElement('div');
                slot.className = `aspect-square rounded-2xl flex items-center justify-center border-2 ${active ? 'stamp-active' : 'border-dashed border-neutral-300 bg-white/50'}`;
                slot.innerHTML = active ? (i === 9 ? '<i data-lucide="gift"></i>' : '<i data-lucide="pizza"></i>') : (i === 9 ? '<i data-lucide="gift" class="text-neutral-300"></i>' : '');
                grid.appendChild(slot);
            }
            lucide.createIcons();

            const btn = document.getElementById('main-button');
            const pinBox = document.getElementById('pin-display');

            if (data.active_pin) {
                btn.classList.add('hidden');
                pinBox.classList.remove('hidden');
                document.getElementById('pin-number').innerText = data.active_pin;
                
                const timeLeft = Math.ceil((300000 - (Date.now() - data.pin_timestamp)) / 1000);
                if (timeLeft <= 0) {
                    updateDoc(doc(db, "users", userEmail), { active_pin: deleteField(), pin_timestamp: deleteField() });
                } else {
                    document.getElementById('pin-timer').innerText = `EXPIRA EN ${timeLeft}s`;
                }
            } else {
                pinBox.classList.add('hidden');
                btn.classList.remove('hidden');
                btn.disabled = false;
                btn.innerText = (data.stamps >= 10) ? "CANJEAR PIZZA GRATIS" : "SOLICITAR SELLO";
                if(data.stamps >= 10) btn.classList.replace('bg-[var(--sd-mustard)]', 'bg-orange-600');
            }
        }

        // --- EL BOTÓN AHORA TIENE EL EVENTO AQUÍ ADENTRO ---
        document.getElementById('main-button').addEventListener('click', async () => {
            const btn = document.getElementById('main-button');
            btn.disabled = true;
            btn.innerText = "GENERANDO...";

            try {
                const pin = Math.floor(1000 + Math.random() * 9000);
                const type = (btn.innerText.includes("PIZZA")) ? "TABLERO" : "SELLO";
                await updateDoc(doc(db, "users", userEmail), {
                    active_pin: pin,
                    pin_timestamp: Date.now(),
                    pin_type: type
                });
            } catch (e) {
                alert("Error de conexión");
                btn.disabled = false;
            }
        });

        // --- INICIO ---
        if (userEmail) {
            onSnapshot(doc(db, "users", userEmail), (snap) => {
                if (snap.exists()) updateUI(snap.data());
            });
        } else {
            document.getElementById('loader').classList.add('hidden');
            document.getElementById('register-modal').classList.remove('hidden');
        }

        // Registro
        document.getElementById('btn-do-register').onclick = async () => {
            const n = document.getElementById('reg-name').value, e = document.getElementById('reg-email').value.toLowerCase().trim();
            if(!n || !e) return alert("Faltan datos");
            await setDoc(doc(db, "users", e), { name: n, email: e, stamps: 1, lastUpdate: new Date() });
            localStorage.setItem(`sd_user_${COMERCIO_ID}`, JSON.stringify(e));
            location.reload();
        };

        lucide.createIcons();
    </script>
</body>
</html>
